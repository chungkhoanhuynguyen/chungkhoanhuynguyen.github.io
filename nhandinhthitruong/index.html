<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Nhận định thị trường</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--tim:#2a1458;--tim2:#3b1d7a;--vang:#ffd23f;--chu:#f4f1ff;--mo:#b9b0d6}
*{box-sizing:border-box}body{margin:0;background:var(--tim);color:var(--chu);font-family:'Be Vietnam Pro',system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mo);font-size:14px;margin:0 0 20px}
.the{background:var(--tim2);border-radius:16px;padding:20px;margin-bottom:16px}
.ngay{color:var(--vang);font-weight:800;font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
pre{white-space:pre-wrap;font:500 16px/1.6 'Be Vietnam Pro',system-ui,sans-serif;margin:0}
button{min-height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--vang);color:var(--tim);font:800 15px 'Be Vietnam Pro',sans-serif;cursor:pointer;transition:transform .12s ease}
button:active{transform:scale(.97)}button.ok{background:#5dff9b}
details summary{cursor:pointer;color:var(--mo);margin:24px 0 12px;font-weight:700}
.cu pre{font-size:15px;color:#e2dcf5}
</style></head><body><div class="wrap">
<h1>Nhận định thị trường</h1><p class="sub">Tự cập nhật sau 15h30 mỗi ngày giao dịch · Trang riêng</p>
<div id="moi"><div class="the">Đang tải…</div></div>
<details><summary>Các phiên trước</summary><div id="cu" class="cu"></div></details>
</div>
<script>
const the=(x,nut)=>{const d=document.createElement('div');d.className='the';const h=document.createElement('div');h.className='ngay';h.textContent='Phiên '+x.phien.split('-').reverse().join('/');
if(nut){const b=document.createElement('button');b.textContent='Sao chép';b.onclick=async()=>{try{await navigator.clipboard.writeText(x.tin);b.textContent='Đã chép ✓';b.classList.add('ok');setTimeout(()=>{b.textContent='Sao chép';b.classList.remove('ok')},1800)}catch(e){b.textContent='Không chép được'}};h.appendChild(b)}
const p=document.createElement('pre');p.textContent=x.tin;d.append(h,p);return d};
fetch('data.json?'+Date.now()).then(r=>r.json()).then(ds=>{const m=document.getElementById('moi');m.innerHTML='';if(!ds.length){m.textContent='Chưa có dữ liệu';return}
m.appendChild(the(ds[0],true));const c=document.getElementById('cu');ds.slice(1).forEach(x=>c.appendChild(the(x,true)))}).catch(()=>{document.getElementById('moi').innerHTML='<div class="the">Chưa tải được dữ liệu.</div>'});
</script></body></html>
