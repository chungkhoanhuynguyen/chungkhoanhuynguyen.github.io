<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0f1115">
<title>Hỏi đáp</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262a33; --text:#e8eaed; --muted:#8b919c; --accent:#3d8bfd; --red:#e5484d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
  h1 { font-size:17px; font-weight:600; margin:4px 0 16px; display:flex; justify-content:space-between; align-items:center; }
  h1 button { font-size:13px; }
  button { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; cursor:pointer; }
  input { font:inherit; width:100%; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; outline:none; }
  input:focus { border-color:var(--accent); }
  .hidden { display:none !important; }
  #gate { margin:auto 0; display:flex; flex-direction:column; gap:10px; }
  #gate .primary { background:var(--accent); border-color:var(--accent); padding:12px; font-weight:600; }
  .note { color:var(--muted); font-size:13px; }
  .err { color:var(--red); font-size:14px; min-height:20px; }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-bottom:12px; }
  .msg { padding:10px 12px; border-radius:12px; max-width:88%; white-space:pre-wrap; }
  .me { align-self:flex-end; background:#1f3a66; }
  .ai { align-self:flex-start; background:var(--card); border:1px solid var(--line); }
  .ai.wait { color:var(--muted); }
  #ctrl { display:flex; flex-direction:column; align-items:center; gap:12px; padding-top:8px; border-top:1px solid var(--line); }
  #mic { width:96px; height:96px; border-radius:50%; background:var(--accent); border:none; display:grid; place-items:center; transition:transform .15s ease, background .15s ease; }
  #mic:active { transform:scale(.96); }
  #mic svg { width:40px; height:40px; fill:#fff; }
  #mic.listen { background:var(--red); animation:pulse 1.2s ease-in-out infinite; }
  #mic.busy { background:#3a3f4a; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(229,72,77,.5);} 50%{ box-shadow:0 0 0 14px rgba(229,72,77,0);} }
  #status { color:var(--muted); font-size:14px; min-height:21px; text-align:center; }
  .row { display:flex; gap:8px; width:100%; }
  .row input { flex:1; }
  .opts { display:flex; gap:16px; font-size:13px; color:var(--muted); flex-wrap:wrap; justify-content:center; }
  .opts label { display:flex; gap:6px; align-items:center; }
  @media (prefers-reduced-motion:reduce){ #mic.listen{ animation:none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1><span>Hỏi đáp nhanh</span><button id="out" class="hidden">Thoát</button></h1>

  <div id="gate">
    <input id="pw" type="password" placeholder="Mật khẩu" autocomplete="current-password">
    <div id="srvBox" class="hidden">
      <input id="srv" type="url" placeholder="Địa chỉ máy chủ (https://....workers.dev)">
      <div class="note">Chỉ cần nhập một lần trên mỗi máy.</div>
    </div>
    <button class="primary" id="enter">Vào</button>
    <div class="err" id="gerr"></div>
  </div>

  <div id="app" class="hidden" style="flex:1;display:flex;flex-direction:column;min-height:0">
    <div id="log"></div>
    <div id="ctrl">
      <div id="status">Bấm nút micro rồi nói</div>
      <button id="mic" aria-label="Nói"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></button>
      <div class="row">
        <input id="txt" placeholder="Hoặc gõ câu hỏi…" enterkeyhint="send">
        <button id="send">Gửi</button>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="loop" style="width:auto"> Nói liên tục</label>
        <label>Tốc độ <input type="range" id="rate" min="0.8" max="1.5" step="0.1" value="1.1" style="width:90px;padding:0"></label>
        <button id="clear" style="padding:4px 10px;font-size:13px">Cuộc mới</button>
      </div>
    </div>
  </div>
</div>

<script>
// Điền địa chỉ Worker vào đây sau khi tạo (hoặc nhập ở màn hình đăng nhập).
const WORKER_URL = "";

const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return sessionStorage.getItem(k) || localStorage.getItem(k); } catch { return null; } },
  set(k,v,keep){ try { (keep?localStorage:sessionStorage).setItem(k,v); } catch {} },
  del(k){ try { sessionStorage.removeItem(k); localStorage.removeItem(k); } catch {} },
};
const serverUrl = () => WORKER_URL || store.get("hd_srv") || "";
let password = null;
let history = [];
let busy = false;

if (!serverUrl()) $("srvBox").classList.remove("hidden");

async function call(payload) {
  const r = await fetch(serverUrl(), {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ matkhau: password, ...payload }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.loi || ("Lỗi " + r.status)), { status:r.status });
  return d;
}

async function login(pw) {
  if (!WORKER_URL) {
    const s = $("srv").value.trim() || store.get("hd_srv");
    if (!s) { $("gerr").textContent = "Cần nhập địa chỉ máy chủ."; return; }
    store.set("hd_srv", s, true);
  }
  password = pw;
  $("gerr").textContent = "Đang kiểm tra…";
  try {
    await call({ kiemtra:true });
    store.set("hd_pw", pw); // chỉ lưu trong phiên trình duyệt hiện tại
    $("gate").classList.add("hidden"); $("app").classList.remove("hidden"); $("out").classList.remove("hidden");
    $("gerr").textContent = "";
    warmVoices();
  } catch (e) {
    password = null; store.del("hd_pw");
    $("gerr").textContent = e.status === 401 ? "Sai mật khẩu." : (e.message || "Không kết nối được máy chủ.");
  }
}
$("enter").onclick = () => login($("pw").value);
$("pw").onkeydown = e => { if (e.key === "Enter") login($("pw").value); };
$("out").onclick = () => { store.del("hd_pw"); location.reload(); };
const saved = (() => { try { return sessionStorage.getItem("hd_pw"); } catch { return null; } })();
if (saved && serverUrl()) login(saved);

// ---------- Giọng đọc ----------
let viVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => /^vi/i.test(v.lang));
  viVoice = vs.find(v => /google/i.test(v.name)) || vs.find(v => /natural|online/i.test(v.name)) || vs[0] || null;
}
function warmVoices() {
  if (!("speechSynthesis" in window)) return;
  pickVoice(); speechSynthesis.onvoiceschanged = pickVoice;
  // mở khóa âm thanh trên iPhone (phải gọi trong thao tác bấm)
  const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u);
}
function speak(text) {
  return new Promise(resolve => {
    if (!("speechSynthesis" in window)) return resolve();
    speechSynthesis.cancel();
    // Chia câu để không bị ngắt giữa chừng trên Chrome
    const parts = text.match(/[^.!?;:\n]+[.!?;:\n]*/g) || [text];
    const chunks = []; let cur = "";
    for (const p of parts) { if ((cur + p).length > 180 && cur) { chunks.push(cur); cur = p; } else cur += p; }
    if (cur.trim()) chunks.push(cur);
    let i = 0;
    const next = () => {
      if (i >= chunks.length) return resolve();
      const u = new SpeechSynthesisUtterance(chunks[i++].trim());
      u.lang = "vi-VN"; if (viVoice) u.voice = viVoice;
      u.rate = parseFloat($("rate").value);
      u.onend = next; u.onerror = () => resolve();
      speechSynthesis.speak(u);
    };
    next();
  });
}

// ---------- Nhận giọng nói ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, heard = "";
function setStatus(t){ $("status").textContent = t; }
function setMic(state){ $("mic").className = state || ""; }

function startListen() {
  if (!SR) { setStatus("Trình duyệt này không nhận giọng nói. Dùng Chrome hoặc Safari, hoặc gõ câu hỏi."); return; }
  speechSynthesis.cancel();
  rec = new SR(); rec.lang = "vi-VN"; rec.interimResults = true; rec.continuous = false;
  heard = "";
  rec.onresult = e => {
    let t = ""; for (const r of e.results) t += r[0].transcript;
    heard = t; setStatus("🎙 " + t);
  };
  rec.onerror = e => { if (e.error === "not-allowed") setStatus("Cần cho phép dùng micro."); else if (e.error === "no-speech") setStatus("Không nghe thấy gì, bấm lại để nói."); };
  rec.onend = () => { listening = false; setMic(""); if (heard.trim()) ask(heard.trim()); else if (!busy) setStatus("Bấm nút micro rồi nói"); };
  rec.start(); listening = true; setMic("listen"); setStatus("Đang nghe… nói xong tự gửi");
}

$("mic").onclick = () => {
  if (busy) return;
  if (speechSynthesis.speaking) { speechSynthesis.cancel(); }
  if (listening) { rec.stop(); return; }
  startListen();
};

// ---------- Hỏi ----------
function add(role, text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "me" : "ai") + (cls ? " " + cls : "");
  d.textContent = text; $("log").appendChild(d); $("log").scrollTop = 1e9; return d;
}
async function ask(q) {
  if (busy || !q) return;
  busy = true; setMic("busy"); setStatus("Đang nghĩ…");
  add("user", q); history.push({ role:"user", content:q });
  const w = add("assistant", "…", "wait");
  try {
    const d = await call({ lichsu: history });
    w.classList.remove("wait"); w.textContent = d.traloi;
    history.push({ role:"assistant", content:d.traloi });
    busy = false; setMic(""); setStatus("Đang nói… bấm micro để ngắt");
    await speak(d.traloi);
    setStatus("Bấm nút micro rồi nói");
    if ($("loop").checked && !listening && !busy) startListen();
  } catch (e) {
    history.pop();
    w.classList.remove("wait"); w.textContent = "⚠ " + (e.message || "Lỗi kết nối");
    if (e.status === 401) { store.del("hd_pw"); setTimeout(() => location.reload(), 1500); }
    busy = false; setMic(""); setStatus("Có lỗi, thử lại.");
  }
}
$("send").onclick = () => { const v = $("txt").value.trim(); $("txt").value = ""; warmVoices(); ask(v); };
$("txt").onkeydown = e => { if (e.key === "Enter") $("send").click(); };
$("clear").onclick = () => { history = []; $("log").innerHTML = ""; speechSynthesis.cancel(); setStatus("Cuộc mới. Bấm micro rồi nói"); };
</script>
</body>
</html>
