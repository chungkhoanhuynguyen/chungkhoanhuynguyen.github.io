<!doctype html><html><head><meta charset="utf-8"><script src="lwc.js"></script>
<style>
body{margin:0;width:1080px;height:1350px;background:#fff;font-family:Inter,sans-serif;color:#1d1726;overflow:hidden;position:relative}
.top{background:#0b1222;color:#fff;padding:26px 36px 22px}
.r1{display:flex;justify-content:space-between;align-items:flex-start}
.r1 b{font:700 40px Inter;display:block}.r1 span{font:500 26px Inter;color:#9aa3b5}
.gp{text-align:right}.gp .g{font:800 64px/1 Inter}.gp .c{font:700 30px Inter;margin-top:6px}
.st{display:flex;gap:34px;margin-top:16px;font:500 23px Inter;color:#9aa3b5}.st b{color:#fff;font-weight:700;margin-left:8px}
.hook{background:#fff;border-bottom:3px solid #1d1726;padding:20px 26px;text-align:center;font:800 58px/1.12 Inter;letter-spacing:-1px;text-transform:uppercase}
#ch{position:absolute;left:6px;right:6px;top:VAR_TOP;bottom:46px}
.lg{position:absolute;left:24px;top:calc(VAR_TOP + 8px);z-index:3;font:600 23px Inter;display:flex;gap:24px}
#ov{position:absolute;left:0;top:0;width:1080px;height:1350px;z-index:4;pointer-events:none}
.br{position:absolute;right:22px;bottom:10px;font:600 22px Inter;color:#8a8496;z-index:5}
</style></head><body>
<div class="top"><div class="r1"><div><b id="ten"></b><span id="sym"></span></div><div class="gp"><div class="g" id="gia"></div><div class="c" id="chg"></div></div></div>
<div class="st" id="st"></div></div>
<div class="hook" id="hook"></div>
<div class="lg"><span style="color:#d08a1e" id="l20"></span><span style="color:#6a2d86" id="l50"></span></div>
<div id="ch"></div><svg id="ov"></svg>
<div class="br">chungkhoanhuynguyen.com</div>
<script>
var D=/*DATA*/;var UP='#1f8a57',DN='#c43c32';
var top0=document.querySelector('.top').offsetHeight+document.querySelector('.hook').offsetHeight;
var up=D.ch>=0,col=up?'#22c55e':'#f05252';
ten.textContent=D.ten;sym.textContent=D.ma+':HSX · Biểu đồ ngày';gia.textContent=D.gia.toFixed(2);gia.style.color=col;
chg.textContent=(up?'+':'')+D.ch.toFixed(2)+' / '+(up?'+':'')+D.pct.toFixed(2)+'%';chg.style.color=col;
var L=D.bars[D.bars.length-1],P=D.bars[D.bars.length-2];
st.innerHTML='Tham chiếu<b>'+P.close.toFixed(2)+'</b>  Mở cửa<b>'+L.open.toFixed(2)+'</b>  Thấp–Cao<b>'+L.low.toFixed(2)+' – '+L.high.toFixed(2)+'</b>  KL<b>'+(L.volume/1e6).toFixed(2)+' tr</b>';
hook.textContent=D.hook;
function sma(c,n){return c.map(function(_,i){if(i<n-1)return null;var s=0;for(var j=i-n+1;j<=i;j++)s+=c[j];return s/n})}
var el=document.getElementById('ch');var t0=document.querySelector('.top').offsetHeight+document.querySelector('.hook').offsetHeight+10;
el.style.top=t0+'px';document.querySelector('.lg').style.top=(t0+8)+'px';
var ch=LightweightCharts.createChart(el,{autoSize:true,
 layout:{background:{type:'solid',color:'#ffffff'},textColor:'#5f5a69',fontSize:21,fontFamily:'Inter',attributionLogo:false},
 grid:{vertLines:{color:'#f4f1f7'},horzLines:{color:'#f4f1f7'}},
 rightPriceScale:{borderColor:'#e1dde8',scaleMargins:{top:.12,bottom:.2}},
 timeScale:{borderColor:'#e1dde8',rightOffset:3,tickMarkFormatter:function(t,ty){var s=typeof t==='string'?t:t.year+'-'+String(t.month).padStart(2,'0')+'-'+String(t.day).padStart(2,'0');if(ty===1)return 'T'+(+s.slice(5,7));return s.slice(8,10)+'/'+s.slice(5,7)}},
 crosshair:{mode:2}});
var b=D.bars,c=b.map(function(x){return x.close});
var k=ch.addSeries(LightweightCharts.CandlestickSeries,{upColor:UP,downColor:DN,borderUpColor:UP,borderDownColor:DN,wickUpColor:UP,wickDownColor:DN,priceLineColor:'rgba(106,45,134,.6)'});
k.setData(b.map(function(x){return{time:x.time,open:x.open,high:x.high,low:x.low,close:x.close}}));
var v=ch.addSeries(LightweightCharts.HistogramSeries,{priceFormat:{type:'volume'},priceScaleId:'vol',lastValueVisible:false,priceLineVisible:false});
v.priceScale().applyOptions({scaleMargins:{top:.84,bottom:0},visible:false});
v.setData(b.map(function(x){return{time:x.time,value:x.volume,color:x.close>=x.open?'rgba(31,138,87,.32)':'rgba(196,60,50,.32)'}}));
[[20,'#d08a1e','l20'],[50,'#6a2d86','l50']].forEach(function(q){var m=sma(c,q[0]);var s=ch.addSeries(LightweightCharts.LineSeries,{color:q[1],lineWidth:3,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
 s.setData(b.map(function(x,i){return m[i]==null?{time:x.time}:{time:x.time,value:m[i]}}));document.getElementById(q[2]).textContent='MA'+q[0]+' '+m[m.length-1].toFixed(2)});
(D.muc||[]).forEach(function(m){k.createPriceLine({price:m.gia,color:'#c43c32',lineWidth:2,lineStyle:2,axisLabelVisible:true,title:m.ten})});
ch.timeScale().fitContent();
setTimeout(function(){
 var ov=document.getElementById('ov'),ns='http://www.w3.org/2000/svg',ox=el.offsetLeft,oy=el.offsetTop,h='';
 h+='<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e3242b"/></marker></defs>';
 (D.diem||[]).forEach(function(p){var x=ch.timeScale().timeToCoordinate(p.t)+ox,y=k.priceToCoordinate(p.g)+oy;
  var lx=x+p.dx,ly=y+p.dy;
  h+='<line x1="'+lx+'" y1="'+ly+'" x2="'+(x+(p.dx>0?8:-8)*0.6)+'" y2="'+(y+(p.dy>0?10:-10))+'" stroke="#e3242b" stroke-width="7" marker-end="url(#a)"/>';
  var w=p.chu.length*15.5+28;var bx=p.dx>0?lx-6:lx-w+6, by=p.dy>0?ly:ly-46;
  h+='<rect x="'+bx+'" y="'+by+'" width="'+w+'" height="46" rx="6" fill="#fff6c7" stroke="#e3242b" stroke-width="2"/>';
  h+='<text x="'+(bx+14)+'" y="'+(by+32)+'" font-family="Inter" font-weight="700" font-size="26" fill="#c0161c">'+p.chu+'</text>'});
 ov.innerHTML=h;document.title='xong'},500);
</script></body></html>
