<!doctype html><html><head><meta charset="utf-8"><script src="lwc.js"></script>
<style>
body{margin:0;width:1080px;height:1080px;background:#fff;font-family:Inter,sans-serif;color:#1d1726;overflow:hidden;position:relative}
.top{background:#0b1222;color:#fff;padding:20px 30px 16px}
.r1{display:flex;justify-content:space-between;align-items:flex-start}
.r1 b{font:700 40px Inter;display:block}.r1 span{font:500 26px Inter;color:#9aa3b5}
.gp{text-align:right}.gp .g{font:800 58px/1 Inter}.gp .c{font:700 30px Inter;margin-top:6px}
.st{display:flex;gap:28px;margin-top:10px;font:500 21px Inter;color:#9aa3b5}.st b{color:#fff;font-weight:700;margin-left:8px}
.hook{background:#fff;border-bottom:3px solid #1d1726;padding:16px 22px;text-align:center;font:800 46px/1.18 Inter,'Noto Color Emoji';letter-spacing:-.5px}
#ch{position:absolute;left:6px;right:392px;top:VAR_TOP;bottom:40px}
.lg{position:absolute;left:24px;top:calc(VAR_TOP + 8px);z-index:3;font:600 23px Inter;display:flex;gap:24px}
#ov{position:absolute;left:0;top:0;width:1080px;height:1080px;z-index:4;pointer-events:none}
.br{position:absolute;right:22px;bottom:10px;font:600 22px Inter;color:#8a8496;z-index:5}
.pn:empty,.kq:empty{display:none}.pn{position:absolute;z-index:6;background:rgba(11,18,34,.94);color:#fff;border-radius:14px;padding:14px 18px;width:340px;font:500 18px/1.45 Inter;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.pn h4{margin:0 0 6px;font:800 17px Inter;letter-spacing:.12em;color:#d9b26a;text-transform:uppercase}.pn div{display:block;margin-top:6px}.pn b{display:block;color:#d9b26a;font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.kq{position:absolute;z-index:6;background:#fff;border:1px solid #e1dde8;border-top:5px solid #c43c32;border-radius:14px;padding:14px 18px;width:340px;font:500 17px/1.45 Inter;box-shadow:0 10px 26px rgba(0,0,0,.18)}
.kq .src{font:600 15px Inter;color:#8a8496;margin-bottom:6px}.kq .h{display:flex;align-items:baseline;gap:10px}.kq .h b{font:800 26px Inter}.kq .h small{color:#8a8496;font:600 16px Inter}
.kq .v{margin-left:auto;font:700 16px Inter;padding:3px 12px;border-radius:999px;border:1px solid}.kq ul{margin:6px 0 0;padding:0;list-style:none}.kq li{padding-left:20px;position:relative}
.kq li.b::before{content:"!";position:absolute;left:5px;color:#c43c32;font-weight:900}.kq li.i::before{content:"•";position:absolute;left:4px;color:#8a8496}
</style></head><body>
<div class="top"><div class="r1"><div><b id="ten"></b><span id="sym"></span></div><div class="gp"><div class="g" id="gia"></div><div class="c" id="chg"></div></div></div>
<div class="st" id="st"></div></div>
<div class="hook" id="hook"></div>
<div class="lg" style="display:none"><span id="l20"></span><span id="l50"></span></div><div id="pn" class="pn"></div><div id="kq" class="kq"></div>
<div id="ch"></div><svg id="ov"></svg>
<div class="br">chungkhoanhuynguyen.com</div>
<script>
var D=/*DATA*/;var UP='#1f8a57',DN='#c43c32';
var top0=document.querySelector('.top').offsetHeight+document.querySelector('.hook').offsetHeight;
var up=D.ch>=0,col=up?'#22c55e':'#f05252';
ten.textContent=D.ten;sym.textContent=D.ma+':HSX';gia.textContent=D.gia.toFixed(2);gia.style.color=col;
chg.textContent=(up?'+':'')+D.ch.toFixed(2)+' / '+(up?'+':'')+D.pct.toFixed(2)+'%';chg.style.color=col;
var L=D.bars[D.bars.length-1],P=D.bars[D.bars.length-2];
st.innerHTML='Tham chiếu<b>'+P.close.toFixed(2)+'</b>  Mở cửa<b>'+L.open.toFixed(2)+'</b>  Thấp–Cao<b>'+L.low.toFixed(2)+' – '+L.high.toFixed(2)+'</b>  KL<b>'+(L.volume/1e6).toFixed(2)+' tr</b>';
hook.textContent=D.hook;var fs=46;while(hook.scrollHeight>80&&fs>30){fs-=2;hook.style.fontSize=fs+'px'}
function sma(c,n){return c.map(function(_,i){if(i<n-1)return null;var s=0;for(var j=i-n+1;j<=i;j++)s+=c[j];return s/n})}
var el=document.getElementById('ch');if(!D.pn)el.style.right='6px';var t0=document.querySelector('.top').offsetHeight+document.querySelector('.hook').offsetHeight+10;
el.style.top=t0+'px';document.querySelector('.lg').style.top=(t0+8)+'px';
var ch=LightweightCharts.createChart(el,{autoSize:true,
 layout:{background:{type:'solid',color:'#ffffff'},textColor:'#5f5a69',fontSize:19,fontFamily:'Inter',attributionLogo:false},
 grid:{vertLines:{color:'#f4f1f7'},horzLines:{color:'#f4f1f7'}},
 rightPriceScale:{borderColor:'#e1dde8',scaleMargins:{top:.12,bottom:.2}},
 timeScale:{borderColor:'#e1dde8',rightOffset:3,tickMarkFormatter:function(t,ty){var s=typeof t==='string'?t:t.year+'-'+String(t.month).padStart(2,'0')+'-'+String(t.day).padStart(2,'0');if(ty===1)return 'T'+(+s.slice(5,7));return s.slice(8,10)+'/'+s.slice(5,7)}},
 crosshair:{mode:2}});
var b=D.bars,c=b.map(function(x){return x.close});
var k=ch.addSeries(LightweightCharts.CandlestickSeries,{upColor:UP,downColor:DN,borderUpColor:UP,borderDownColor:DN,wickUpColor:UP,wickDownColor:DN,priceLineColor:'rgba(106,45,134,.6)'});
k.setData(b.map(function(x){return{time:x.time,open:x.open,high:x.high,low:x.low,close:x.close}}));
var v=ch.addSeries(LightweightCharts.HistogramSeries,{priceFormat:{type:'volume'},priceScaleId:'vol',lastValueVisible:false,priceLineVisible:false});
v.priceScale().applyOptions({scaleMargins:{top:.84,bottom:0},visible:false});
v.setData(b.map(function(x){return{time:x.time,value:x.volume,color:x.close>=x.open?'rgba(31,138,87,.32)':'rgba(196,60,50,.32)'}}));
[[20,'#d08a1e','l20'],[50,'#6a2d86','l50']].forEach(function(q){var m=sma(c,q[0]);var s=ch.addSeries(LightweightCharts.LineSeries,{color:q[1],lineWidth:4,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
 s.setData(b.map(function(x,i){return m[i]==null?{time:x.time}:{time:x.time,value:m[i]}}));document.getElementById(q[2]).textContent='MA'+q[0]+' '+m[m.length-1].toFixed(2)});
(D.muc||[]).forEach(function(m){k.createPriceLine({price:m.gia,color:'#5f5a69',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:m.ten})});
ch.timeScale().fitContent();
setTimeout(function(){
 var ov=document.getElementById('ov'),ns='http://www.w3.org/2000/svg',ox=el.offsetLeft,oy=el.offsetTop,h='';
 h+='<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e3242b"/></marker></defs>';
 var W=el.clientWidth-90;
 (D.vung||[]).forEach(function(z){var y1=k.priceToCoordinate(z.tren)+oy,y2=k.priceToCoordinate(z.duoi)+oy;
  h+='<rect x="'+ox+'" y="'+y1+'" width="'+W+'" height="'+(y2-y1)+'" fill="'+(z.mau||'rgba(196,60,50,.18)')+'"/>';
  h+='<text x="'+(z.trai?ox+10:ox+W-10)+'" y="'+(z.trai?y2+24:y1-8)+'" text-anchor="'+(z.trai?'start':'end')+'" font-family="Inter" font-weight="800" font-size="26" fill="'+(z.mauChu||'#7a2620')+'">'+z.ten+'</text>'});
 (D.diem||[]).forEach(function(p){var x=ch.timeScale().timeToCoordinate(p.t)+ox,y=k.priceToCoordinate(p.g)+oy;
  var lx=x+p.dx,ly=y+p.dy,w=p.chu.length*14.2+30;
  h+='<line x1="'+x+'" y1="'+y+'" x2="'+lx+'" y2="'+ly+'" stroke="#1d1726" stroke-width="2.5"/>';
  h+='<circle cx="'+x+'" cy="'+y+'" r="9" fill="#ffd23f" stroke="#1d1726" stroke-width="3.5"/>';
  var bx=p.dx>=0?lx:lx-w;var mx=ox+el.clientWidth-70-w;if(bx>mx)bx=mx;if(bx<ox+4)bx=ox+4;
  h+='<rect x="'+bx+'" y="'+(ly-23)+'" width="'+w+'" height="46" rx="23" fill="#1d1726"/>';
  h+='<text x="'+(bx+15)+'" y="'+(ly+9)+'" font-family="Inter" font-weight="800" font-size="25" fill="#fff">'+p.chu+'</text>'});
 var P=D.pn,Q=D.kq;
 if(P){pn.innerHTML='<h4>Góc nhìn kỹ thuật</h4>'+P.dong.map(function(r){return '<div><b>'+r[0]+'</b><span>'+r[1]+'</span></div>'}).join('');pn.style.left='706px';pn.style.top=(oy)+'px'}
 if(Q){var vc={neg:['#b42318','#fde7e5','#f6c1bc','Tiêu cực'],mid:['#8a6410','#fbf1d9','#ecd59c','Trung tính'],pos:['#0f7a43','#e3f7ea','#b7e6c8','Tích cực']}[Q.v];
  kq.style.borderTopColor=vc[0];
  kq.innerHTML='<div class="src">Trên chungkhoanhuynguyen.com</div><div class="h"><b>'+D.ma+'</b><small>'+Q.q+'</small><span class="v" style="color:'+vc[0]+';background:'+vc[1]+';border-color:'+vc[2]+'">'+vc[3]+'</span></div><ul>'+
   Q.info.map(function(x){return '<li class="i">'+x+'</li>'}).join('')+Q.bad.map(function(x){return '<li class="b">'+x+'</li>'}).join('')+'</ul>';
  kq.style.left='706px';kq.style.top=(oy+pn.offsetHeight+16)+'px'}
 (D.hop||[]).forEach(function(p){var bar=D.bars.filter(function(x){return x.time===p.t})[0];var x=ch.timeScale().timeToCoordinate(p.t)+ox,y1=k.priceToCoordinate(bar.high)+oy-8,y2=k.priceToCoordinate(bar.low)+oy+8;
  h+='<rect x="'+(x-11)+'" y="'+y1+'" width="22" height="'+(y2-y1)+'" fill="none" stroke="#d1121b" stroke-width="4"/>';
  var tx=x+p.dx,ty=(p.dy<0?y1:y2)+p.dy;h+='<line x1="'+x+'" y1="'+(p.dy<0?y1:y2)+'" x2="'+(tx-(p.dx>0?6:-6))+'" y2="'+ty+'" stroke="#d1121b" stroke-width="3"/>';
  p.chu.forEach(function(l,i){h+='<text x="'+tx+'" y="'+(ty+10+i*40)+'" text-anchor="'+(p.dx>0?'start':'end')+'" font-family="Inter" font-weight="800" font-size="32" fill="#d1121b" stroke="#fff" stroke-width="6" paint-order="stroke">'+l+'</text>'})});
 if(D.fib){var a=D.fib[0],z=D.fib[1];[0.236,0.382,0.5,0.618].forEach(function(r){var g=z+(a-z)*r,y=k.priceToCoordinate(g)+oy;
  h+='<line x1="'+ox+'" y1="'+y+'" x2="'+(ox+el.clientWidth-80)+'" y2="'+y+'" stroke="#8a8496" stroke-width="1.2" stroke-dasharray="6 5"/>';
  h+='<text x="'+(ox+8)+'" y="'+(y-6)+'" font-family="Inter" font-weight="700" font-size="20" fill="#4a4555">Fibo '+r.toFixed(3).replace(/0+$/,'').replace('.',',')+' · '+g.toFixed(1).replace('.',',')+'</text>'})}
 if(D.emo){h+='<text x="'+D.emo[1]+'" y="'+D.emo[2]+'" font-size="170" font-family="Noto Color Emoji">'+D.emo[0]+'</text>'}
 ov.innerHTML=h;document.title='xong'},500);
</script></body></html>
