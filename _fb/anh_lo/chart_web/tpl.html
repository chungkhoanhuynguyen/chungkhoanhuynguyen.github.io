<!doctype html><html><head><meta charset="utf-8"><script src="lwc.js"></script>
<style>
body{margin:0;width:1080px;height:1350px;background:#fff;font-family:Inter,sans-serif;color:#1d1726;overflow:hidden}
.h{padding:34px 40px 0;display:flex;align-items:center;gap:22px}
.bk{width:72px;height:72px;border-radius:50%;background:#f1edf5;display:grid;place-items:center;font:700 52px Inter;color:#4c2766}
.t b{display:block;font:700 38px Inter}.t span{font:500 28px Inter;color:#6f6a7a}
.p{padding:18px 40px 0;display:flex;align-items:center;gap:22px}
.g{font:800 120px/1 Inter;letter-spacing:-2px}.c{font:700 40px Inter;padding:8px 18px;border-radius:10px}
.m{margin:36px auto 0;width:max-content;padding:14px 34px;border:4px solid #1d1726;border-radius:20px;font:700 66px "DejaVu Serif";background:#fff;box-shadow:6px 6px 0 #1d1726}
#ch{position:absolute;left:10px;right:10px;top:470px;bottom:30px}
.lg{position:absolute;left:30px;top:478px;z-index:3;font:600 24px Inter;display:flex;gap:26px}
</style></head><body>
<div class="h"><div class="bk">‹</div><div class="t"><b id="ten"></b><span id="sym"></span></div></div>
<div class="p"><div class="g" id="gia"></div><div class="c" id="chg"></div></div>
<div class="m" id="meme"></div>
<div class="lg"><span style="color:#d08a1e" id="l20"></span><span style="color:#6a2d86" id="l50"></span></div>
<div id="ch"></div>
<script>
var D=/*DATA*/;var UP='#1f8a57',DN='#c43c32';
var up=D.ch>=0,col=up?UP:DN;
ten.textContent=D.ten;sym.textContent=D.ma+' (HSX) · Ngày';gia.textContent=D.gia.toFixed(2);gia.style.color=col;
chg.textContent=(up?'▲ +':'▼ ')+D.ch.toFixed(2)+' ('+(up?'+':'')+D.pct.toFixed(2)+'%)';chg.style.color=col;chg.style.background=up?'#e3f7ea':'#fde7e5';
meme.textContent=D.meme;
function sma(c,n){return c.map(function(_,i){if(i<n-1)return null;var s=0;for(var j=i-n+1;j<=i;j++)s+=c[j];return s/n})}
var ch=LightweightCharts.createChart(document.getElementById('ch'),{autoSize:true,
 layout:{background:{type:'solid',color:'#ffffff'},textColor:'#5f5a69',fontSize:22,fontFamily:'Inter',attributionLogo:false},
 grid:{vertLines:{color:'#f4f1f7'},horzLines:{color:'#f4f1f7'}},
 rightPriceScale:{borderColor:'#e1dde8',scaleMargins:{top:.1,bottom:.22}},
 timeScale:{borderColor:'#e1dde8',rightOffset:3,tickMarkFormatter:function(t,ty){var s=typeof t==='string'?t:t.year+'-'+String(t.month).padStart(2,'0')+'-'+String(t.day).padStart(2,'0');if(ty===1)return 'T'+(+s.slice(5,7));return s.slice(8,10)+'/'+s.slice(5,7)}},
 crosshair:{mode:2}});
var b=D.bars,c=b.map(function(x){return x.close});
var k=ch.addSeries(LightweightCharts.CandlestickSeries,{upColor:UP,downColor:DN,borderUpColor:UP,borderDownColor:DN,wickUpColor:UP,wickDownColor:DN,priceLineColor:'rgba(106,45,134,.6)'});
k.setData(b.map(function(x){return{time:x.time,open:x.open,high:x.high,low:x.low,close:x.close}}));
var v=ch.addSeries(LightweightCharts.HistogramSeries,{priceFormat:{type:'volume'},priceScaleId:'vol',lastValueVisible:false,priceLineVisible:false});
v.priceScale().applyOptions({scaleMargins:{top:.82,bottom:0}});
v.setData(b.map(function(x){return{time:x.time,value:x.volume,color:x.close>=x.open?'rgba(31,138,87,.32)':'rgba(196,60,50,.32)'}}));
[[20,'#d08a1e','l20'],[50,'#6a2d86','l50']].forEach(function(q){var m=sma(c,q[0]);var s=ch.addSeries(LightweightCharts.LineSeries,{color:q[1],lineWidth:3,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
 s.setData(b.map(function(x,i){return m[i]==null?{time:x.time}:{time:x.time,value:m[i]}}));document.getElementById(q[2]).textContent='MA'+q[0]+' '+m[m.length-1].toFixed(2)});
ch.timeScale().fitContent();
</script></body></html>
