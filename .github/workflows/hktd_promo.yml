name: HKTĐ video quảng bá
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['_promo/hktd/**', '.github/workflows/hktd_promo.yml']
permissions:
  contents: write
concurrency: { group: hktd-promo, cancel-in-progress: true }
jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scene: [s0, s1, s2, s3, s4, s4b, s5, s6, s7, s8]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            thienkiemmon
            _promo/hktd
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Cài công cụ
        run: |
          pip install -q playwright
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Quay cảnh ${{ matrix.scene }}
        run: |
          cp -r _promo/hktd/pf thienkiemmon/pf
          (cd thienkiemmon && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          OUT=$PWD/fr python3 _promo/hktd/cap.py ${{ matrix.scene }}
          ls fr/${{ matrix.scene }} | wc -l
          ffmpeg -y -loglevel error -framerate 30 -i fr/${{ matrix.scene }}/%04d.jpg -vf "scale=1920:1080:flags=lanczos,format=yuv420p" -c:v libx264 -crf 18 -preset veryfast ${{ matrix.scene }}.tmp.mp4
          mv ${{ matrix.scene }}.tmp.mp4 ${{ matrix.scene }}.mp4
      - uses: actions/upload-artifact@v4
        with: { name: '${{ matrix.scene }}', path: '${{ matrix.scene }}.mp4' }
  join:
    needs: cap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: _promo/hktd }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with: { path: parts, merge-multiple: true }
      - name: Ghép cảnh + nhạc
        run: |
          pip install -q numpy
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          # Nhạc: Imperial China Cinematic – Shane Ivers (silvermansound.com, CC BY 4.0), ghi công ở cảnh kết
          curl -sL --retry 3 -o track.mp3 https://www.silvermansound.com/wp-content/uploads/imperial-china-cinematic.mp3 || true
          if [ -s track.mp3 ] && ffmpeg -y -loglevel error -i track.mp3 -ac 2 -ar 44100 track.wav; then
            for s in s0 s1 s2 s3 s4 s4b s5 s6 s7 s8; do echo "file 'parts/$s.mp4'" >> l0.txt; done
            ffmpeg -y -loglevel error -f concat -safe 0 -i l0.txt -c copy v0.mp4
            D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 v0.mp4)
            ST=$(python3 -c "
          import wave,numpy as np,sys
          w=wave.open('track.wav');n=w.getnframes();a=np.frombuffer(w.readframes(n),np.int16).reshape(-1,2).astype(np.float32).mean(1)
          sr=44100;D=float('$D');sec=np.sqrt(np.add.reduceat(a*a,np.arange(0,len(a),sr))/sr)
          W=int(D)+1;best=max(range(0,max(1,len(sec)-W)),key=lambda i:sec[i:i+W].mean()*0.7+sec[i:i+6].mean()*0.3);print(best)")
            echo "start=$ST dur=$D"
            ffmpeg -y -loglevel error -ss $ST -t $D -i track.wav -af "afade=t=in:d=1.2,afade=t=out:st=$(python3 -c "print(float('$D')-3)"):d=3,loudnorm=I=-15:TP=-1.5" music.wav
          else
            python3 _promo/hktd/music.py
          fi
          for s in s0 s1 s2 s3 s4 s4b s5 s6 s7 s8; do echo "file 'parts/$s.mp4'" >> list.txt; done
          ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -c copy v.mp4
          ffmpeg -y -loglevel error -i v.mp4 -i music.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest hktd_promo.mp4
          ffmpeg -y -loglevel error -i hktd_promo.mp4 -vf scale=1280:720 -c:v libx264 -crf 24 -preset veryfast -c:a copy hktd_promo_720.mp4
          ls -la hktd_promo*.mp4
      - name: Đẩy lên nhánh video-out
        run: |
          git config user.name "hktd-bot"; git config user.email "hktd-bot@users.noreply.github.com"
          git fetch -q --depth=1 origin video-out
          git worktree add -q ../vo origin/video-out
          mkdir -p ../vo/hktd && cp hktd_promo_720.mp4 ../vo/hktd/
          cd ../vo && git add --sparse hktd && git commit -qm "HKTĐ video quảng bá $(date +%F_%H%M)" && git push -q origin HEAD:video-out
