name: San tin nong (RSS, mien phi)
on:
  schedule:
    - cron: "17 23 * * *"   # 06:17 giờ VN
    - cron: "17 5 * * *"    # 12:17 giờ VN
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-push
jobs:
  san:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python _kiem/san_tin.py
      - run: |
          git config user.name "hn-bot"; git config user.email "hn-bot@users.noreply.github.com"
          git add data/tin && (git diff --cached --quiet || git commit -m "San tin $(date -u +%F)")
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs -q && git push && break; sleep 5; done
