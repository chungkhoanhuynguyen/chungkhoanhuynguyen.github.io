name: Do view mien phi (yt-dlp)
on:
  schedule:
    - cron: "37 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-push
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -U yt-dlp
      - run: python _kiem/do_view.py
      - run: python _hoc/dien_id.py && python hoc.py && python ma.py
      - run: |
          git config user.name "hn-bot"
          git config user.email "hn-bot@users.noreply.github.com"
          git add -A data/view _hoc/videos.json hoc ma index.html sitemap.xml
          git diff --cached --quiet || git commit -m "Do view + mo bai hoc $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs -q && git push && break; sleep 5; done
