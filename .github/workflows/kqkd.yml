name: Cap nhat danh gia BCTC
on:
  schedule:
    - cron: "23 10 * * 1-6"
    - cron: "23 14 * * 1-6"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-push
jobs:
  kqkd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python kqkd.py
      - run: |
          git config user.name "hn-bot"
          git config user.email "hn-bot@users.noreply.github.com"
          git add data/kqkd.json
          git diff --cached --quiet || git commit -m "Cap nhat danh gia BCTC $(date -u +%F)"
          git pull --rebase -q || true
          git push
