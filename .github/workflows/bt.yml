name: Kiem thu phuong phap (backtest)
on:
  workflow_dispatch:
    inputs:
      tep: {description: "script trong _kiem", default: "bt.py"}
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - run: python3 -u _kiem/${{ inputs.tep }} 2>&1 | tee _kiem/ketqua.txt
      - uses: actions/upload-artifact@v4
        with: {name: bt, path: _kiem/ketqua.txt}
