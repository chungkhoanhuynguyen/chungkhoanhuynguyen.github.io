name: Video ke chuyen (chibi)
on:
  push:
    paths: ["_video/story/tap*/truyen.json"]
  workflow_dispatch:
    inputs:
      tap: {description: "thư mục tập trong _video/story", required: true}
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with: {path: "~/.cache/huggingface\n~/.cache/pip\n~/.u2net", key: kc-v1}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -q vieneu "onnxruntime==1.22.1" numpy pillow rembg opencv-python-headless
      - id: t
        run: |
          T="${{ github.event.inputs.tap }}"
          if [ -z "$T" ]; then T=$(git diff --name-only HEAD~1 HEAD | grep -o '_video/story/tap[^/]*' | tail -1 | xargs basename); fi
          echo "tap=$T" >> $GITHUB_OUTPUT
      - run: mkdir -p out && python _video/story/ke_chuyen.py _video/story/${{ steps.t.outputs.tap }}/truyen.json out/${{ steps.t.outputs.tap }}.mp4
      - run: |
          cd out && git init -q -b story-out && git config user.name hn-bot && git config user.email hn-bot@users.noreply.github.com
          git add -A && git commit -qm "${{ steps.t.outputs.tap }}" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" story-out
