name: Cap nhat bang
on:
  schedule:
    - cron: "17 2-8 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
      - run: |
          git config user.name "rs-bot"
          git config user.email "rs-bot@users.noreply.github.com"
          git add data/rs.json
          git diff --cached --quiet || git commit -m "Cap nhat RS $(date -u +%F)"
          git push
