name: Cap nhat bang
on:
  schedule:
    - cron: "2,17,32,47 2-7 * * 1-5"
    - cron: "7 8 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-push
jobs:
  bang:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
      - run: python mw.py || true
      - run: |
          git config user.name "hn-bot"
          git config user.email "hn-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "Cap nhat bang $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break; sleep $((i*7)); done  # QL1 23/11: tranh push voi workflow khac
