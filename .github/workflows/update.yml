name: Cap nhat bang
on:
  schedule:
    - cron: "2,17,32,47 2-7 * * 1-5"
    - cron: "7 8 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-push
jobs:
  bang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
      - run: python mw.py || true
      - run: |
          git config user.name "hn-bot"
          git config user.email "hn-bot@users.noreply.github.com"
          git add data/rs.json data/mw.json
          git diff --cached --quiet || git commit -m "Cap nhat bang $(date -u +%F)"
          git pull --rebase -q || true
          git push
