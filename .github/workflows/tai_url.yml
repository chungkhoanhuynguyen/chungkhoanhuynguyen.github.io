name: Tai anh theo URL
on:
  workflow_dispatch:
    inputs:
      ds: {description: "JSON [[ten, url], ...]", required: true}
      tag: {description: "release", required: true}
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          python3 - <<'PY'
          import json, urllib.request
          import re
          ds = json.loads('''${{ inputs.ds }}''')
          if ds and ds[0][0] == "@zips":
              h = urllib.request.urlopen(urllib.request.Request(ds[0][1], headers={"User-Agent": "Mozilla/5.0"}), timeout=60).read().decode("utf8", "ignore")
              ds = [[u.split("/")[-1], u if u.startswith("http") else "https://opengameart.org" + u] for u in dict.fromkeys(re.findall(r'href="([^"]+\.zip)"', h))]
              print(ds)
          for ten, u in ds:
              d = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=120).read()
              open(f"out/{ten}", "wb").write(d); print("OK", ten, len(d))
          PY
      - env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}"}
        run: |
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 || gh release create "${{ inputs.tag }}" -t "${{ inputs.tag }}" -n anh
          gh release upload "${{ inputs.tag }}" out/* --clobber
