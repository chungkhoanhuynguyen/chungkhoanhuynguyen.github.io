name: Cap nhat tin va lich su kien
on:
  schedule:
    - cron: "47 0,4,9,13 * * 1-5"
    - cron: "47 2 * * 6"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-push
jobs:
  info:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python info.py
      - run: |
          git config user.name "hn-bot"
          git config user.email "hn-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "Cap nhat tin su kien $(date -u +%F)"
          git pull --rebase -q || true
          git push
