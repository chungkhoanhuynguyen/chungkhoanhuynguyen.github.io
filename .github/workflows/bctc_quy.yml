name: Video BCTC quy (1 ma/video, kenh phu Y2)
# Thứ 2-4-6: chọn mã VN30/ngân hàng tiếp theo chưa làm trong quý -> _video/queue/<ngày>_bctc -> gọi video.yml dựng.
on:
  schedule: [{cron: "17 0 * * 3"}]
  workflow_dispatch:
    inputs:
      so_ma: {description: "Số mã", default: "1"}
permissions: {contents: write, actions: write}
concurrency: {group: bctc-quy}
jobs:
  tao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: t
        env: {SO_MA: "${{ github.event.inputs.so_ma || '1' }}", CW: "${{ github.workspace }}"}
        run: python3 _video/bctc/tao.py
      - if: steps.t.outputs.lo != ''
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          git config user.name chungkhoanhuynguyen; git config user.email noreply@github.com
          git add _video/queue/${{ steps.t.outputs.lo }} _video/bctc/da_lam.json data/can_gia.json
          git commit -qm "BCTC quy ${{ steps.t.outputs.lo }}" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          gh workflow run video.yml -f batch=${{ steps.t.outputs.lo }}
      - if: steps.t.outputs.lo == ''
        run: |
          git config user.name chungkhoanhuynguyen; git config user.email noreply@github.com
          git add data/can_gia.json && git commit -qm "Xin gia bank" && git pull -q --rebase && git push -q || true
