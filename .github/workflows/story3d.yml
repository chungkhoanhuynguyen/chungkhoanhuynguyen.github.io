name: Thu video ke chuyen 3D (Blender mien phi)
on:
  push:
    paths: ["_video/story/thu3d.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libxi6 libxkbcommon0 libxrender1 libgl1 libsm6 libxxf86vm1 libxfixes3 >/dev/null
      - name: Tai Blender
        run: |
          curl -sL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar -xJ -C /tmp
          /tmp/blender-4.2.3-linux-x64/blender -v | head -1
      - name: Dung 3D
        run: |
          mkdir -p out
          /usr/bin/time -v /tmp/blender-4.2.3-linux-x64/blender -b -noaudio -P _video/story/thu3d.py -- /tmp/f3d 10 720 1280 16 2>&1 | grep -E "Elapsed|Error|Traceback|Fra:1 |3D:" | tail -20
          cat /tmp/f3d/thoi_gian.txt | tee out/thoi_gian.txt
          ffmpeg -y -loglevel error -framerate 24 -i /tmp/f3d/f_%04d.png -vf scale=1080:1920:flags=lanczos -pix_fmt yuv420p -c:v libx264 -crf 20 out/thu3d.mp4
          nproc >> out/thoi_gian.txt
      - name: Day len nhanh story-out
        run: |
          cd out && git init -q -b story-out && git config user.name hn-bot && git config user.email hn-bot@users.noreply.github.com
          git add -A && git commit -qm "thu3d" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" story-out
