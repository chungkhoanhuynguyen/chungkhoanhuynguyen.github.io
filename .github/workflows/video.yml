name: Xuong video (giong mien phi + dung)
# Đẩy lô kịch bản vào _video/queue/<LÔ>/ (video_dai.py + px_tuan.json [+ meta.json]) -> tự đọc giọng, dựng, xuất mp4.
# Kết quả: nhánh video-out (thư mục <LÔ>/) + Release "video-<LÔ>".
on:
  push:
    paths: ["_video/queue/**/video_dai.py"]
  workflow_dispatch:
    inputs:
      batch: {description: "Tên lô (thư mục trong _video/queue)", required: true}
      keys: {description: "KEY cách nhau dấu cách (để trống = tất cả)", required: false, default: ""}
permissions:
  contents: write
concurrency:
  group: video-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      batch: ${{ steps.p.outputs.batch }}
      keys: ${{ steps.p.outputs.keys }}
      has3d: ${{ steps.p.outputs.has3d }}
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - id: p
        run: |
          python3 - <<'PY'
          import os, re, json, subprocess
          b = "${{ github.event.inputs.batch }}".strip(); ks = "${{ github.event.inputs.keys }}".split()
          if not b:
              ch = subprocess.run(["git", "diff", "--name-only", "HEAD~1", "HEAD"], capture_output=True, text=True).stdout.split()
              ds = [p.split("/")[2] for p in ch if p.startswith("_video/queue/") and p.endswith("video_dai.py")]
              b = ds[-1] if ds else ""
          if b and not ks:
              src = open(f"_video/queue/{b}/video_dai.py", encoding="utf-8").read()
              ks = re.findall(r'^S\[["\x27]([A-Za-z0-9_]+)["\x27]\]\s*=', src, re.M)
          # lô có cảnh 3D kể chuyện ('k': '3d', xem _video/r3d.py) -> bước render cài Remotion + nới giờ
          h3 = "1" if b and re.search(r"['\x22]k['\x22]\s*:\s*['\x22]3d['\x22]", open(f"_video/queue/{b}/video_dai.py", encoding="utf-8").read()) else "0"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              # 20/11: cảnh 3D dựng song song – chia đều khung cho NS máy (job r3d), ~8 s/khung trên máy GitHub
              ns = int(os.environ.get("NS3D", "12")) if h3 == "1" else 1
              f.write(f"batch={b}\nkeys={json.dumps(ks)}\nhas3d={h3}\nshards={json.dumps(list(range(ns)))}\n")
          print(b, ks)
          PY
  # ---- chỉ lô có cảnh 3D: (1) tts – đọc giọng 1 lần + danh sách cảnh 3D cần dựng; (2) r3d – NS máy dựng song song từng khúc khung;
  #      (3) render – dùng lại đúng giọng đó, ghép khúc 3D (r3d.prep) rồi dựng video như cũ. Lô không có 3D: bỏ qua 2 job này.
  tts:
    needs: plan
    if: needs.plan.outputs.batch != '' && needs.plan.outputs.has3d == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        key: ${{ fromJson(needs.plan.outputs.keys) }}
    env: {CANH3D_FPS: "10"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: vieneu-v1
      - uses: actions/cache/restore@v4
        with:
          path: _video/out/cache3d
          key: canh3d-${{ matrix.key }}-${{ github.run_id }}
          restore-keys: canh3d-${{ matrix.key }}-
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
      - run: pip install -q vieneu "onnxruntime==1.22.1" numpy pillow opencv-python-headless
      - run: python _video/render.py "${{ needs.plan.outputs.batch }}" "${{ matrix.key }}" --chi-3d "/tmp/giong/${{ matrix.key }}"
      - run: cp /tmp/giong/${{ matrix.key }}/j3d.json /tmp/giong/j3d_${{ matrix.key }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: giong-${{ matrix.key }}
          path: /tmp/giong/
          retention-days: 3
  r3d:
    needs: [plan, tts]
    if: needs.plan.outputs.has3d == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    env: {CANH3D_FPS: "10", CANH3D_CONC: "4"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: /tmp/giong, pattern: giong-*, merge-multiple: true}
      - id: c
        run: |
          python3 -c "import json,glob,sys; sys.path.insert(0,'_video'); import r3d; J=[]; [J.extend(json.load(open(f))) for f in sorted(glob.glob('/tmp/giong/j3d_*.json'))]; print('n=%d' % len(r3d.chia(J, ${{ strategy.job-total }})[${{ matrix.shard }}]))" >> $GITHUB_OUTPUT
      - if: steps.c.outputs.n != '0'
        uses: actions/setup-node@v4
        with: {node-version: 20}
      - if: steps.c.outputs.n != '0'
        uses: actions/cache@v4
        with:
          path: _video/anim3d/node_modules
          key: anim3d-nm-${{ hashFiles('_video/anim3d/package.json') }}
      - if: steps.c.outputs.n != '0'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
      - if: steps.c.outputs.n != '0'
        working-directory: _video/anim3d
        run: npm i --no-audit --no-fund -s
      - if: steps.c.outputs.n != '0'
        run: python3 _video/r3d.py dung ${{ matrix.shard }} ${{ strategy.job-total }} /tmp/giong/j3d_*.json
      - if: steps.c.outputs.n != '0'
        uses: actions/upload-artifact@v4
        with:
          name: c3-${{ matrix.shard }}
          path: _video/out/cache3d/c3_*.p*.mp4
          retention-days: 3
  render:
    needs: [plan, tts, r3d]
    if: always() && needs.plan.outputs.batch != '' && (needs.plan.outputs.has3d != '1' || needs.tts.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.plan.outputs.has3d == '1' && 330 || 90 }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        key: ${{ fromJson(needs.plan.outputs.keys) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: vieneu-v1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
      - run: pip install -q vieneu "onnxruntime==1.22.1" numpy pillow opencv-python-headless
      # ---- chỉ khi lô có cảnh 'k': '3d': cài xưởng anim3d (Remotion) + kho đoạn 3D đã dựng (theo mã băm) ----
      - if: needs.plan.outputs.has3d == '1'
        uses: actions/setup-node@v4
        with: {node-version: 20}
      - if: needs.plan.outputs.has3d == '1'
        uses: actions/cache@v4
        with:
          path: _video/anim3d/node_modules
          key: anim3d-nm-${{ hashFiles('_video/anim3d/package.json') }}
      - if: needs.plan.outputs.has3d == '1'
        uses: actions/cache@v4
        with:
          path: _video/out/cache3d
          key: canh3d-${{ matrix.key }}-${{ github.run_id }}
          restore-keys: canh3d-${{ matrix.key }}-
      - if: needs.plan.outputs.has3d == '1'
        working-directory: _video/anim3d
        run: npm i --no-audit --no-fund -s
      # lô 3D: giọng đã đọc ở job tts (giữ đúng độ dài câu) + các khúc 3D từ job r3d -> r3d.prep ghép lại; khúc nào thiếu thì tự dựng tại chỗ
      - if: needs.plan.outputs.has3d == '1'
        uses: actions/download-artifact@v4
        with:
          path: /tmp/giong
          pattern: giong-${{ matrix.key }}
          merge-multiple: true
      - if: needs.plan.outputs.has3d == '1'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with: {path: _video/out/cache3d, pattern: c3-*, merge-multiple: true}
      - run: python _video/render.py "${{ needs.plan.outputs.batch }}" "${{ matrix.key }}"
        env:
          CANH3D_CONC: "4"
          CANH3D_FPS: "10"
          HN_WAV_DIR: ${{ needs.plan.outputs.has3d == '1' && format('/tmp/giong/{0}', matrix.key) || '' }}
      - name: Tu cat 3 Shorts + bia A/B/C (QL1 11/11)
        continue-on-error: true
        run: |
          B="${{ needs.plan.outputs.batch }}"; K="${{ matrix.key }}"
          export HN_PX="_video/queue/$B/px_tuan.json"
          timeout 900 python _video/tu_cat_short.py _video/out "$K" "$B" || true
          timeout 600 python _video/bia_ab.py "$B" "$K" || true
      - name: Nghe lai giong bang whisper (QC bat buoc, NV1 20/11)
        continue-on-error: true
        run: |
          pip install -q faster-whisper || true
          timeout 1500 python _video/tool/wsp_qc.py _video/out "${{ matrix.key }}" || true
      - name: Soat tu dong (khung hinh, bia, Shorts, QC, Gemini) – anh Huy 21/11 tan dung GitHub, NV1 khong ngoi cho
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: timeout 900 bash _video/tool/tu_soat.sh _video/out "${{ matrix.key }}" || true
      - if: needs.plan.outputs.has3d == '1'
        run: rm -f _video/out/cache3d/c3_*.p*.mp4   # khúc đã ghép, không lưu vào cache
      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.key }}
          path: |
            _video/out/
            !_video/out/cache3d/
          retention-days: 7
  publish:
    needs: [plan, render]
    if: always() && needs.plan.outputs.batch != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {path: art, pattern: out-*, merge-multiple: true}
      - name: Day len nhanh video-out + Release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          B="${{ needs.plan.outputs.batch }}"
          mkdir -p /tmp/vo/$B && cp -r art/* /tmp/vo/$B/ 2>/dev/null || true
          cp _video/queue/$B/meta.json /tmp/vo/$B/ 2>/dev/null || true
          ls -la /tmp/vo/$B > /tmp/vo/$B/TRANG_THAI.txt
          echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> /tmp/vo/$B/TRANG_THAI.txt
          git config --global user.name hn-bot; git config --global user.email hn-bot@users.noreply.github.com
          cd /tmp/vo
          if git ls-remote --exit-code "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" video-out >/dev/null 2>&1; then
            git clone -q --depth 1 -b video-out "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" repo
          else
            mkdir repo && cd repo && git init -q -b video-out && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" && cd ..
          fi
          cd repo
          # giữ 12 lô gần nhất; đẩy lại dạng orphan (1 commit) để repo không phình; thử lại nếu đụng lô khác
          for i in 1 2 3 4 5 6; do
            git fetch -q --depth 1 origin video-out 2>/dev/null && git reset -q --hard FETCH_HEAD || true
            rm -rf tuan_*/ 2>/dev/null || true   # lô tuần 3/11 cũ đã đăng hết (còn trong Release) – trước đây chiếm chỗ làm lô mới bị xoá
            ls -1d 20*/ 2>/dev/null | sort | head -n -11 | xargs -r rm -rf
            rm -rf "$B" && cp -r "/tmp/vo/$B" .
            git checkout -q --orphan tmp_$i && git add -A && git commit -qm "video $B" && git push -qf origin tmp_$i:video-out && break
            sleep $((RANDOM % 20 + 5))
          done
          cd /tmp/vo
          gh release delete "video-$B" -y -R ${{ github.repository }} 2>/dev/null || true
          gh release create "video-$B" -R ${{ github.repository }} -t "Video $B" -n "Lô $B" /tmp/vo/$B/*.mp4 /tmp/vo/$B/*.png /tmp/vo/$B/*.txt /tmp/vo/$B/*.srt /tmp/vo/$B/*.json || true
