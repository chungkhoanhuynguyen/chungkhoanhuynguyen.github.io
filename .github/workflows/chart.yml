name: Cap nhat du lieu bieu do
on:
  schedule:
    - cron: "33 1 * * 1-5"
    - cron: "17 8 * * 1-5"
    - cron: "43 12 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-push
jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python chart.py
      - run: |
          git config user.name "hn-bot"
          git config user.email "hn-bot@users.noreply.github.com"
          git add -A data/c
          git diff --cached --quiet || git commit -m "Cap nhat bieu do $(date -u +%F)"
          git pull --rebase -q || true
          git push
