/* VOICE: chiến trường sa mạc, bụi vàng, MMO kiếm hiệp
   IDEA: màn hình game MMO thật — HUD vàng đồng trên nền cảnh 3D
   PICTURE: toàn màn hình là thế giới 3D góc nhìn chéo
   COLOUR and TYPE: đồng thau, đỏ máu, xanh nội lực; Noto Serif cho tên, Noto Sans cho số
   LAYOUT: bản đồ trái trên, nhiệm vụ phải, máu giữa dưới, kỹ năng phải dưới */
:root{color-scheme:dark;--gold:#e7c57a;--ink:#f3ead8;--panel:rgba(18,14,10,.62)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a140c;color:var(--ink);font:14px/1.35 "Noto Sans",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#gl{display:block;position:fixed;inset:0;width:100%;height:100%}
.ui{position:fixed;pointer-events:none}
#mm{left:10px;top:10px;width:150px;text-align:center}
#mm canvas{width:150px;height:150px;border-radius:50%;border:3px solid #a98a4e;box-shadow:0 0 0 2px #2b2014,0 4px 14px rgba(0,0,0,.5);display:block}
#mm .dir{position:absolute;top:-2px;left:50%;transform:translateX(-50%);font:700 11px "Noto Serif",serif;background:#2b2014;border:1px solid #a98a4e;border-radius:8px;padding:0 6px}
#mm .nm{font:700 12px "Noto Serif",serif;color:#7dff8c;text-shadow:0 1px 2px #000;margin-top:4px}
#mm .xy{font-size:11px;color:#9fe;text-shadow:0 1px 2px #000}
#quest{right:10px;top:58px;width:230px;background:var(--panel);border:1px solid rgba(231,197,122,.4);border-radius:8px;padding:8px 10px}
#quest b{font:700 13px "Noto Serif",serif;color:var(--gold)}#quest div{font-size:12.5px;margin-top:3px}
#top{right:10px;top:10px;display:flex;gap:8px;pointer-events:auto}
.btn{font:600 13px "Noto Serif",serif;color:var(--ink);background:var(--panel);border:1px solid rgba(231,197,122,.6);border-radius:18px;min-height:40px;padding:0 14px;cursor:pointer}
#chat{left:10px;bottom:96px;width:min(380px,58vw);font-size:12.5px;text-shadow:0 1px 2px #000,0 0 4px #000}
#chat p{margin:2px 0;padding:1px 6px;background:rgba(0,0,0,.28);border-radius:4px;width:fit-content;max-width:100%}
#chat .s{color:#ffe27a}#chat .n{color:#7fd3ff}#chat .k{color:#ff8a7a}
#bars{left:50%;bottom:14px;transform:translateX(-50%);width:min(420px,52vw)}
.bar{height:16px;border:1px solid #6b5432;background:#1b120b;position:relative;border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .15s}
.bar span{position:absolute;inset:0;text-align:center;font:700 11px/16px "Noto Sans";text-shadow:0 1px 1px #000}
#hp i{background:linear-gradient(#e2453c,#8e1712)}#mp i{background:linear-gradient(#3f8ff0,#16438f)}#xp{height:5px}#xp i{background:#f3c94a}
#lv{font:700 12px "Noto Serif",serif;color:var(--gold);text-shadow:0 1px 2px #000;display:flex;justify-content:space-between}
#skills{right:12px;bottom:12px;width:270px;height:270px;pointer-events:none}
.sk{position:absolute;border-radius:50%;border:2px solid #c8a45e;background:radial-gradient(circle at 35% 30%,#5d4a33,#1d150d 70%);color:var(--ink);font:700 11px/1.15 "Noto Serif",serif;cursor:pointer;pointer-events:auto;overflow:hidden;box-shadow:0 0 10px rgba(0,0,0,.6),inset 0 0 12px rgba(255,210,140,.18);padding:0}
.sk em{display:block;font-style:normal;font-size:20px;line-height:1;margin-bottom:2px;filter:drop-shadow(0 0 4px currentColor)}
.sk i{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) var(--cd,0%),transparent 0);pointer-events:none}
.sk:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#sA{width:96px;height:96px;right:6px;bottom:6px;font-size:14px}
#s1,#s2,#s3,#s4,#s5,#s6,#s7,#s8{width:58px;height:58px;font-size:10px}#s7{right:152px;bottom:152px;color:#c8b8ff}#s8{right:56px;bottom:202px;color:#ff9a50}#s1{right:135px;bottom:25px;color:#9fe6ff}#s2{right:126px;bottom:68px;color:#ffd36b}#s4{right:103px;bottom:103px;color:#8fe8ff}#s5{right:68px;bottom:126px;color:#ffa060}#s6{right:25px;bottom:135px;color:#d0f0ff}#s3{right:202px;bottom:56px;color:#c6ff9f}
.lab{position:fixed;left:0;top:0;pointer-events:none;text-align:center;white-space:nowrap;font:600 12px "Noto Serif",serif;text-shadow:0 1px 2px #000,0 0 3px #000}
.lab .hb{width:46px;height:4px;margin:2px auto 0;background:#300;border:1px solid #000}.lab .hb i{display:block;height:100%;background:#e33}
.lab.f .hb i{background:#3d3}.lab .tt{display:inline-block;font:800 11px "Noto Serif",serif;color:#dff4ff;padding:2px 14px;margin-bottom:2px;background:linear-gradient(90deg,transparent,rgba(40,90,150,.85) 20%,rgba(40,90,150,.85) 80%,transparent);border-top:1px solid #9fd8ff;border-bottom:1px solid #9fd8ff}
.dmg{position:fixed;pointer-events:none;font:800 20px "Noto Sans",sans-serif;transform:translate(-50%,-50%);text-shadow:0 2px 2px #000}
.joy{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(231,197,122,.5);background:rgba(20,16,12,.25);display:none;pointer-events:none;transform:translate(-50%,-50%)}
.joy b{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(231,197,122,.55)}
#hint{left:50%;top:10px;transform:translateX(-50%);font-size:12px;opacity:.9;text-shadow:0 1px 3px #000;text-align:center;max-width:46vw}
#lvup{left:50%;top:32%;transform:translate(-50%,-50%);font:800 34px "Noto Serif",serif;color:#ffe38a;text-shadow:0 0 18px #ff9a1f,0 2px 2px #000;opacity:0;transition:opacity .4s}

 ['Sinh tồn','• Máu tự hồi khi không đánh nhau; <b>máu dưới 30% thì rút lui</b> hoặc về thành (nút ngôi nhà).<br>• Đừng vào bãi quái cao hơn mình quá 10 cấp — quái có kỹ năng, đánh rất đau.<br>• Chết thì <b>hồi sinh ngay tại Tế Đàn</b> cạnh quảng trường. • Chết là <b>rơi toàn bộ đồ, kể cả đồ đang mặc</b> — đồ quý hãy gửi Bảo Khố. • <b>Chết sẽ tổn hao tu vi, có thể tụt cấp</b>, và rơi 1–2 món đồ trong túi + một ít linh thạch tại chỗ ngã xuống. Mũi tên vàng chỉ về chỗ cũ — quay lại nhặt nhanh, kẻ khác có thể nhặt mất và đem bày sạp bán.<br>• Trong thành có lính tuần tra: bật <b>Đồ sát</b> thì tên đỏ, chết rơi nhiều đồ hơn và bị lính truy đuổi.<br>• Ma tu giết người xong chạy tới xác để <b>Vạn Hồn Phiên hút hồn phách</b> — tu vi gấp nhiều lần đánh quái, nhưng cũng là mục tiêu của cả thiên hạ.'],
 ['Tổ đội & cướp bóc','Chạm vào một người chơi → <b>Mời vào tổ đội</b> (tối đa 5 người). Đồng đội đi theo, đánh cùng mục tiêu của bạn; bật <b>Đồ sát</b> để cả đội đi cướp đồ người khác.<br>Ngoài các cổng thành có <b>băng cướp</b> phục kích: ra thành một mình dễ bị chặn giết, tụt cấp và rơi đồ. Đi theo đội hoặc ngự kiếm bay qua.'],
 ['Công đức & danh hiệu','Chính đạo diệt ma tu, băng cướp, cường giả đoạt bảo → <b>công đức</b>. Ma tu giết người → <b>sát nghiệp</b>. Mỗi mốc mở một <b>danh hiệu</b>, mỗi danh hiệu +1,5% công, thủ, sinh lực.<br>Chính đạo: Hiệp Khách → Nghĩa Sĩ → Chính Đạo Tiên Phong → Trừ Ma Vệ Đạo → Thiên Hạ Đại Hiệp → Chính Đạo Minh Chủ.<br>Ma đạo: Sát Thần Tập Sự → Huyết Thủ → Nhân Đồ → Ma Đầu → Huyết Ma Vương → Ma Đạo Chí Tôn.<br>Ngoài thành có <b>Cường Giả Đoạt Bảo</b> rình giết người cướp đồ. Ma tu đánh quái yếu hơn chính đạo (−35%) nhưng hút hồn người lên cấp cực nhanh (mỗi xác cùng cấp ≈ 60% một tầng, cường giả gấp đôi) — giết người xong đứng cạnh xác 5–10 giây để Vạn Hồn Phiên thu hồn, và <b>Chấp Pháp Trưởng Lão</b> săn kẻ tên đỏ.'],
 ['Phong Thần & thành tựu','Top 10 Phong Thần Bảng mỗi người có danh hiệu riêng (Thiên Hạ Đệ Nhất +5% … Tân Tinh +1% công, thủ, sinh lực); lên xuống hạng được thông báo toàn máy chủ. Diệt yêu thú tích <b>liên sát</b> (thưởng linh thạch mỗi 10), mốc tiêu diệt tổng và từng loài mở <b>thành tựu</b>, mỗi cái +0,5% công vĩnh viễn.'],
 ['Chơi trực tuyến','Đăng nhập bằng ID + mật khẩu, mỗi tài khoản tạo được <b>tối đa 5 nhân vật</b>, nhân vật tự lưu trên máy chủ mỗi 30 giây. Người chơi thật trông y hệt các tu sĩ khác — không ai biết ai là người thật, ẩn mình giữa đám đông cũng là chiến thuật. Gõ vào ô chat để nói với cả thế giới.']];

function fxQuad(map,col,w,h,pos,opt){opt=opt||{};const mat=new T.MeshBasicMaterial({map,color:col,transparent:true,blending:opt.add?T.AdditiveBlending:T.NormalBlending,depthWrite:false,side:T.DoubleSide,fog:false,toneMapped:false});const g=new T.Group();const geo=new T.PlaneGeometry(w,h);if(opt.anchor)geo.translate(0,h/2,0);const a=new T.Mesh(geo,mat);g.add(a);if(opt.cross){const b=new T.Mesh(geo,mat);b.rotation.y=Math.PI/2;g.add(b)}if(opt.flat){a.rotation.x=-Math.PI/2}g.position.copy(pos);if(opt.ry!=null)g.rotation.y=opt.ry;if(opt.rz!=null)g.rotation.z=opt.rz;addFx(g,opt.dur||1,(o,k,dt)=>{mat.opacity=opt.fade===false?1:(k<.15?k/.15:k>.6?Math.max(0,(1-k)/.4):1);if(opt.upd)opt.upd(o,k,dt)});return g}
function spike(p,h,col,dur,tilt){const X=cpTex(),c=new T.Color(col);const g=fxQuad(X.flame,c,h*.5,h,p,{anchor:1,cross:1,dur:dur||1,ry:Math.random()*3,upd:(o,k)=>{const gk=Math.min(1,k*6);o.m.scale.set(1+.15*Math.sin(k*60),gk*(1+.08*Math.sin(k*45)),1)}});g.rotation.z=R2(tilt||.2);return g}

function dragonStep(g,wp,dir,t){const U=g.userData;U.hist.unshift(wp.clone());if(U.hist.length>200)U.hist.pop();U.head.position.copy(wp);U.head.position.y+=Math.sin(t*12)*.12*U.dsz;U.head.rotation.y=Math.atan2(-dir.z,dir.x);const sp=.32*U.dsz,H0=U.hist;let seg=0,acc=0,need=sp;for(let j=1;j<H0.length&&seg<U.segs.length;j++){const a=H0[j-1],b=H0[j],L=a.distanceTo(b);if(L<1e-4)continue;let u=0;while(acc+L*(1-u)>=need&&seg<U.segs.length){const du=(need-acc)/L;u+=du;acc=0;need=sp;const s=U.segs[seg];s.position.lerpVectors(a,b,Math.min(1,u));s.position.y+=Math.sin(t*12-seg*.6)*.25*U.dsz;seg++}acc+=L*(1-u)}for(;seg<U.segs.length;seg++){const s=U.segs[seg];s.position.copy(H0[H0.length-1])}}

 grp.add(new T.Mesh(new T.TubeGeometry(curve,arr.length*2,w,3,false),m1),new T.Mesh(new T.TubeGeometry(curve,arr.length*2,w*2.4,4,false),m2));const hitS=glowSp(col,6,1);hitS.position.copy(pts[pts.length-1]).setY(pts[pts.length-1].y+.4);grp.add(hitS);

function jag(a,b,n){const out=[a.clone()];for(let i=1;i<n;i++){const k=i/n;out.push(new T.Vector3(a.x+(b.x-a.x)*k+R2(1.6),a.y+(b.y-a.y)*k,a.z+(b.z-a.z)*k+R2(1.6)))}out.push(b.clone());return out}
