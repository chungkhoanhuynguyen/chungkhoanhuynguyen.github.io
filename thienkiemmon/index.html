<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Thiên Kiếm Môn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;800&family=Noto+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: chiến trường sa mạc, bụi vàng, MMO kiếm hiệp
   IDEA: màn hình game MMO thật — HUD vàng đồng trên nền cảnh 3D
   PICTURE: toàn màn hình là thế giới 3D góc nhìn chéo
   COLOUR and TYPE: đồng thau, đỏ máu, xanh nội lực; Noto Serif cho tên, Noto Sans cho số
   LAYOUT: bản đồ trái trên, nhiệm vụ phải, máu giữa dưới, kỹ năng phải dưới */
:root{color-scheme:dark;--gold:#e7c57a;--ink:#f3ead8;--panel:rgba(18,14,10,.62)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a140c;color:var(--ink);font:14px/1.35 "Noto Sans",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#gl{display:block;position:fixed;inset:0;width:100%;height:100%}
.ui{position:fixed;pointer-events:none}
#mm{left:10px;top:10px;width:150px;text-align:center}
#mm canvas{width:150px;height:150px;border-radius:50%;border:3px solid #a98a4e;box-shadow:0 0 0 2px #2b2014,0 4px 14px rgba(0,0,0,.5);display:block}
#mm .dir{position:absolute;top:-2px;left:50%;transform:translateX(-50%);font:700 11px "Noto Serif",serif;background:#2b2014;border:1px solid #a98a4e;border-radius:8px;padding:0 6px}
#mm .nm{font:700 12px "Noto Serif",serif;color:#7dff8c;text-shadow:0 1px 2px #000;margin-top:4px}
#mm .xy{font-size:11px;color:#9fe;text-shadow:0 1px 2px #000}
#quest{right:10px;top:60px;width:230px;background:var(--panel);border:1px solid rgba(231,197,122,.4);border-radius:8px;padding:8px 10px}
#quest b{font:700 13px "Noto Serif",serif;color:var(--gold)}#quest div{font-size:12.5px;margin-top:3px}
#top{right:10px;top:10px;display:flex;gap:8px;pointer-events:auto}
.btn{font:600 13px "Noto Serif",serif;color:var(--ink);background:var(--panel);border:1px solid rgba(231,197,122,.6);border-radius:18px;min-height:40px;padding:0 14px;cursor:pointer}
#chat{left:10px;bottom:96px;width:min(380px,58vw);font-size:12.5px;text-shadow:0 1px 2px #000,0 0 4px #000}
#chat p{margin:2px 0;padding:1px 6px;background:rgba(0,0,0,.28);border-radius:4px;width:fit-content;max-width:100%}
#chat .s{color:#ffe27a}#chat .n{color:#7fd3ff}#chat .k{color:#ff8a7a}
#bars{left:50%;bottom:14px;transform:translateX(-50%);width:min(420px,52vw)}
.bar{height:16px;border:1px solid #6b5432;background:#1b120b;position:relative;border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .15s}
.bar span{position:absolute;inset:0;text-align:center;font:700 11px/16px "Noto Sans";text-shadow:0 1px 1px #000}
#hp i{background:linear-gradient(#e2453c,#8e1712)}#mp i{background:linear-gradient(#3f8ff0,#16438f)}#xp{height:5px}#xp i{background:#f3c94a}
#lv{font:700 12px "Noto Serif",serif;color:var(--gold);text-shadow:0 1px 2px #000;display:flex;justify-content:space-between}
#skills{right:12px;bottom:12px;width:270px;height:200px;pointer-events:none}
.sk{position:absolute;border-radius:50%;border:2px solid #c8a45e;background:radial-gradient(circle at 35% 30%,#5d4a33,#1d150d 70%);color:var(--ink);font:700 11px/1.15 "Noto Serif",serif;cursor:pointer;pointer-events:auto;overflow:hidden;box-shadow:0 0 10px rgba(0,0,0,.6),inset 0 0 12px rgba(255,210,140,.18);padding:0}
.sk em{display:block;font-style:normal;font-size:20px;line-height:1;margin-bottom:2px;filter:drop-shadow(0 0 4px currentColor)}
.sk i{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) var(--cd,0%),transparent 0);pointer-events:none}
.sk:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#sA{width:96px;height:96px;right:6px;bottom:6px;font-size:14px}
#s1,#s2,#s3,#s4,#s5,#s6{width:58px;height:58px;font-size:10px}#s1{right:135px;bottom:25px;color:#9fe6ff}#s2{right:126px;bottom:68px;color:#ffd36b}#s4{right:103px;bottom:103px;color:#8fe8ff}#s5{right:68px;bottom:126px;color:#ffa060}#s6{right:25px;bottom:135px;color:#d0f0ff}#s3{right:205px;bottom:20px;color:#c6ff9f}
.lab{position:fixed;left:0;top:0;pointer-events:none;text-align:center;white-space:nowrap;font:600 12px "Noto Serif",serif;text-shadow:0 1px 2px #000,0 0 3px #000}
.lab .hb{width:46px;height:4px;margin:2px auto 0;background:#300;border:1px solid #000}.lab .hb i{display:block;height:100%;background:#e33}
.lab.f .hb i{background:#3d3}.lab .tt{display:inline-block;font:800 11px "Noto Serif",serif;color:#dff4ff;padding:2px 14px;margin-bottom:2px;background:linear-gradient(90deg,transparent,rgba(40,90,150,.85) 20%,rgba(40,90,150,.85) 80%,transparent);border-top:1px solid #9fd8ff;border-bottom:1px solid #9fd8ff}
.dmg{position:fixed;pointer-events:none;font:800 20px "Noto Sans",sans-serif;transform:translate(-50%,-50%);text-shadow:0 2px 2px #000}
.joy{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(231,197,122,.5);background:rgba(20,16,12,.25);display:none;pointer-events:none;transform:translate(-50%,-50%)}
.joy b{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(231,197,122,.55)}
#hint{left:50%;top:10px;transform:translateX(-50%);font-size:12px;opacity:.9;text-shadow:0 1px 3px #000;text-align:center;max-width:46vw}
#lvup{left:50%;top:32%;transform:translate(-50%,-50%);font:800 34px "Noto Serif",serif;color:#ffe38a;text-shadow:0 0 18px #ff9a1f,0 2px 2px #000;opacity:0;transition:opacity .4s}
#load{position:fixed;inset:0;display:grid;place-items:center;background:#1a140c;z-index:9;font:600 18px "Noto Serif",serif;transition:opacity .6s}
#err{position:fixed;left:10px;right:10px;bottom:10px;background:#3a0d10;color:#fff;padding:10px;font:13px monospace;display:none;z-index:10;white-space:pre-wrap}
.touch #hint{display:none}
@media(max-width:700px){#mm{transform:scale(.72);transform-origin:0 0}#quest{width:170px;top:56px;font-size:11px}#quest div{font-size:11px}#chat{bottom:150px;width:60vw;font-size:11px}#bars{left:10px;transform:none;width:50vw;bottom:10px}#skills{transform:scale(.88);transform-origin:100% 100%;right:6px;bottom:6px}}
</style>
</head>
<body>
<div id="load">Đang tải Thiên Kiếm Môn…</div>
<div class="ui" id="mm"><canvas id="mmc" width="300" height="300"></canvas><span class="dir">Bắc</span><div class="nm">Thiên Kiếm Môn</div><div class="xy" id="xy">0/0</div></div>
<div class="ui" id="quest"><b>Nhiệm Vụ</b><div id="qt">Tiêu diệt Sơn Tặc: 0/10</div><div style="color:#bfb">Thưởng: kinh nghiệm lớn</div></div>
<div class="ui" id="hint">WASD chạy · Kéo chuột xoay camera · Lăn chuột zoom · Phím 1–5 dùng chiêu · Space khinh công · J đánh thường</div>
<div class="ui" id="chat"></div>
<div class="ui" id="bars"><div id="lv"><span id="lvt">Cấp 1</span><span>Bạch Y Kiếm Khách</span></div>
 <div class="bar" id="hp"><i></i><span></span></div><div class="bar" id="mp"><i></i><span></span></div><div class="bar" id="xp"><i></i></div></div>
<div class="ui" id="skills">
 <button class="sk" id="s1"><em>☾</em>Kiếm khí<i></i></button>
 <button class="sk" id="s2"><em>✦</em>Vạn kiếm<i></i></button>
 <button class="sk" id="s3"><em>➶</em>Khinh công<i></i></button>
 <button class="sk" id="s4"><em>龍</em>Thần Long<i></i></button>
 <button class="sk" id="s5"><em>鳳</em>Phượng Hoàng<i></i></button>
 <button class="sk" id="s6"><em>旋</em>Phong Toàn<i></i></button>
 <button class="sk" id="sA"><em>⚔</em>Đánh<i></i></button>
</div>
<div class="ui" id="lvup">THĂNG CẤP!</div>
<div class="joy" id="joy"><b id="knob"></b></div>
<div id="err"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
window.onerror=(m,s,l)=>{const e=document.getElementById('err');e.style.display='block';e.textContent='Lỗi: '+m+' (dòng '+l+')'};
{
const T=THREE;T.ColorManagement.legacyMode=false;
const touch=matchMedia('(pointer:coarse)').matches;if(touch)document.body.classList.add('touch');
const DPR=Math.min(devicePixelRatio,touch?1.5:2);
const renderer=new T.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.domElement.id='gl';
renderer.setPixelRatio(DPR);renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(45,innerWidth/innerHeight,.5,1200);
const $=id=>document.getElementById(id);

/* ---------- tiện ích ---------- */
let seed=11;const rnd=()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)},lerp=(a,b,t)=>a+(b-a)*t,pick=a=>a[Math.floor(Math.random()*a.length)];
const hsh=(x,z)=>{const s=Math.sin(x*127.1+z*311.7)*43758.5453;return s-Math.floor(s)};
function noise(x,z){const ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz,u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);return lerp(lerp(hsh(ix,iz),hsh(ix+1,iz),u),lerp(hsh(ix,iz+1),hsh(ix+1,iz+1),u),v)}
function fbm(x,z){let a=0,m=1,f=1,s=0;for(let i=0;i<5;i++){a+=m*noise(x*f,z*f);s+=m;m*=.5;f*=2.03}return a/s}
function merge(list){list=list.map(g=>g.index?g.toNonIndexed():g);let n=0;list.forEach(g=>n+=g.attributes.position.count);const p=new Float32Array(n*3),nm=new Float32Array(n*3);let o=0;
 list.forEach(g=>{p.set(g.attributes.position.array,o);nm.set(g.attributes.normal.array,o);o+=g.attributes.position.array.length});
 const r=new T.BufferGeometry();r.setAttribute('position',new T.BufferAttribute(p,3));r.setAttribute('normal',new T.BufferAttribute(nm,3));return r}
const uTime={value:0};
function sway(mat,amt){mat.onBeforeCompile=s=>{s.uniforms.uTime=uTime;s.vertexShader='uniform float uTime;\n'+s.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
#ifdef USE_INSTANCING
vec3 ip=vec3(instanceMatrix[3][0],instanceMatrix[3][1],instanceMatrix[3][2]);float sw=sin(uTime*1.6+ip.x*.3+ip.z*.2)*.6+sin(uTime*3.4+ip.x)*.2;
transformed.x+=sw*max(position.y,0.)*${amt};transformed.z+=sw*max(position.y,0.)*${amt}*.6;
#endif`)};return mat}
function canvasTex(sz,draw){const c=document.createElement('canvas');c.width=c.height=sz;draw(c.getContext('2d'),sz);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;return t}
const softTex=canvasTex(64,(g,s)=>{const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'#fff');r.addColorStop(.4,'rgba(255,255,255,.5)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,s,s)});
const GLN=`float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+1.),f.x),f.y);}
float fb(vec2 p){float a=0.,m=.5;for(int i=0;i<5;i++){a+=m*vn(p);p*=2.03;m*=.5;}return a;}
varying vec3 vWP;\n`;
function worldShader(mat,colorCode,normalCode){mat.onBeforeCompile=s=>{s.uniforms.uTime=uTime;
 s.vertexShader='varying vec3 vWP;\n'+s.vertexShader.replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvWP=(modelMatrix*vec4(transformed,1.)).xyz;\n#ifdef USE_INSTANCING\nvWP=(modelMatrix*instanceMatrix*vec4(transformed,1.)).xyz;\n#endif');
 s.fragmentShader='uniform float uTime;\n'+GLN+s.fragmentShader.replace('#include <color_fragment>','#include <color_fragment>\n'+colorCode).replace('#include <normal_fragment_maps>','#include <normal_fragment_maps>\n'+(normalCode||''))};return mat}

/* ---------- tải tài nguyên ---------- */
const LM=new T.LoadingManager();let assetsReady=false;LM.onLoad=()=>{assetsReady=true};
LM.onProgress=(u,a,b)=>{const l=$('load');if(l)l.textContent='Đang tải Thiên Kiếm Môn… '+Math.round(a/b*100)+'%'};
const TL=new T.TextureLoader(LM),maxAni=renderer.capabilities.getMaxAnisotropy();
const texCache={};
function tex(name,rep,isColor=true){const k=name+rep;if(texCache[k])return texCache[k];const t=TL.load('tex/'+name+'.jpg');t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=Math.min(8,maxAni);if(isColor)t.encoding=T.sRGBEncoding;return texCache[k]=t}
function pbr(name,o={}){return new T.MeshStandardMaterial(Object.assign({map:tex(name+'_Diffuse'),normalMap:tex(name+'_nor_gl',1,false),roughness:.85},o))}
/* uv theo kích thước thật để texture không bị kéo giãn */
function boxUV(g,sc){const w=g.parameters.width,h=g.parameters.height,d=g.parameters.depth,uv=g.attributes.uv,dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
 for(let f=0;f<6;f++)for(let k=0;k<4;k++){const i=f*4+k;uv.setXY(i,uv.getX(i)*dims[f][0]/sc,uv.getY(i)*dims[f][1]/sc)}return g}
const mMarble=pbr('marble_01',{roughness:.8,color:0xa89e8e}),mGranite=pbr('granite_tile_03',{roughness:.8}),mRoof=pbr('grey_roof_tiles',{roughness:.6,side:T.DoubleSide,color:0x8a8f99}),
 mRed=pbr('red_plaster_weathered',{roughness:.6,color:0xd04a3c}),mWood=pbr('lacquered_cherry_wood',{roughness:.45,color:0xb04a32}),mRockW=pbr('rock_wall_08',{roughness:.9}),
 mBark=pbr('bark_brown_02',{roughness:1}),mGold=new T.MeshStandardMaterial({color:0xd9a441,roughness:.3,metalness:.9}),mDark=new T.MeshStandardMaterial({color:0x2a2420,roughness:.8});
/* hoa văn đấu củng xanh vàng và song cửa */
const bandTex=canvasTex(256,(g,s)=>{g.fillStyle='#1f5f5a';g.fillRect(0,0,s,s);for(let i=0;i<8;i++){const x=i*32;g.fillStyle='#2f8f7f';g.fillRect(x+2,6,28,s-12);g.fillStyle='#d9a441';g.fillRect(x+12,0,8,s);g.fillStyle='#14324a';g.beginPath();g.arc(x+16,s/2,9,0,7);g.fill();g.fillStyle='#e9d6a0';g.beginPath();g.arc(x+16,s/2,4,0,7);g.fill()}
 g.fillStyle='#d9a441';g.fillRect(0,0,s,5);g.fillRect(0,s-5,s,5)});bandTex.wrapS=T.RepeatWrapping;
const latTex=canvasTex(256,(g,s)=>{g.fillStyle='#f0e2c0';g.fillRect(0,0,s,s);g.strokeStyle='#6e2016';g.lineWidth=7;for(let i=0;i<=8;i++){g.beginPath();g.moveTo(i*32,0);g.lineTo(i*32,s);g.stroke();g.beginPath();g.moveTo(0,i*32);g.lineTo(s,i*32);g.stroke()}
 g.lineWidth=4;for(let i=0;i<8;i++)for(let j=0;j<8;j++)if((i+j)%2){g.beginPath();g.moveTo(i*32,j*32);g.lineTo(i*32+32,j*32+32);g.stroke()}g.lineWidth=18;g.strokeRect(0,0,s,s)});
const mBand=new T.MeshStandardMaterial({map:bandTex,roughness:.6}),mLat=new T.MeshStandardMaterial({map:latTex,roughness:.8,emissive:0x2a1a08,emissiveIntensity:.3});

/* ---------- mặt đất ---------- */
const PLAZA={x:32,z0:-30,z1:22,y:.6},STAIR={x:9,z0:-38,z1:-30},UP={x:42,z0:-74,z1:-38,y:4.6};
function Ht(x,z){const dx=Math.max(0,Math.abs(x)-44),dz=Math.max(0,z-30,-80-z),d=Math.hypot(dx,dz);let h=(fbm(x*.02,z*.02)-.45)*6*sm(0,30,d);const r=Math.hypot(x,z+20);h+=Math.pow(sm(110,170,r),1.3)*fbm(x*.015+3,z*.015)*70;return h}
function H(x,z){const ax=Math.abs(x);if(ax<=PLAZA.x&&z>=PLAZA.z0&&z<=PLAZA.z1)return PLAZA.y;if(ax<=STAIR.x&&z<STAIR.z0+8&&z>=STAIR.z0)return PLAZA.y+(STAIR.z1-z)/8*(UP.y-PLAZA.y);
 if(ax<=UP.x&&z<UP.z1&&z>=UP.z0)return UP.y;return Ht(x,z)}
const SZ=400,SEG=touch?160:230,tg=new T.PlaneGeometry(SZ,SZ,SEG,SEG);tg.rotateX(-Math.PI/2);const tp=tg.attributes.position;for(let i=0;i<tp.count;i++)tp.setY(i,Ht(tp.getX(i),tp.getZ(i)));tg.computeVertexNormals();
const tGrass=tex('leafy_grass_Diffuse'),tPath=tex('grass_path_2_Diffuse'),tRock=tex('rock_wall_08_Diffuse');
const terrMat=new T.MeshStandardMaterial({map:tGrass,roughness:1});
terrMat.onBeforeCompile=s=>{Object.assign(s.uniforms,{tPath:{value:tPath},tRock:{value:tRock}});
 s.vertexShader='varying vec3 vWP;varying vec3 vWN;\n'+s.vertexShader.replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvWP=(modelMatrix*vec4(transformed,1.)).xyz;vWN=normalize(mat3(modelMatrix)*objectNormal);');
 s.fragmentShader='uniform sampler2D tPath,tRock;varying vec3 vWP;varying vec3 vWN;\n'+GLN.replace('varying vec3 vWP;','')+s.fragmentShader.replace('#include <map_fragment>',`
 vec2 wp=vWP.xz;vec3 g1=texture2D(map,wp*.11).rgb,g2=texture2D(map,wp*.027+.3).rgb;vec3 gc=mix(g1,g2,.35)*vec3(.78,.98,.62);
 vec3 pc=texture2D(tPath,wp*.09).rgb;vec3 rc=mix(texture2D(tRock,vec2(vWP.x+vWP.z,vWP.y)*.06).rgb,texture2D(tRock,wp*.05).rgb,abs(vWN.y));
 float n=fb(wp*.04);float pw=smoothstep(.55,.7,n);float near=1.-smoothstep(36.,52.,max(abs(vWP.x),0.));pw=max(pw,smoothstep(5.,3.,abs(vWP.x))*step(22.,vWP.z)*.9);
 float rw=smoothstep(.86,.72,vWN.y)+smoothstep(14.,30.,vWP.y);vec3 col=mix(mix(gc,pc,pw),rc,clamp(rw,0.,1.));col*=.85+fb(wp*.5)*.3;
 diffuseColor.rgb*=col;`)};
const terrain=new T.Mesh(tg,terrMat);terrain.receiveShadow=true;scene.add(terrain);

/* ---------- quảng trường, bậc thềm, nền cao ---------- */
const colliders=[];// [minx,maxx,minz,maxz,top]
const box=(w,h,d,m,x,y,z,sc=4,par=scene)=>{const me=new T.Mesh(boxUV(new T.BoxGeometry(w,h,d),sc),m);me.position.set(x,y,z);me.castShadow=me.receiveShadow=true;par.add(me);return me};
box(PLAZA.x*2,2,PLAZA.z1-PLAZA.z0,mMarble,0,PLAZA.y-1,(PLAZA.z0+PLAZA.z1)/2,5);

 if(creating){ix=iz=0}const sy=Math.sin(yaw),cy=Math.cos(yaw);let mx=ix*cy+iz*sy,mz=-ix*sy+iz*cy;const moving=il>.1;if(moving)P.auto=null;
 if(P.auto){if(P.auto.dead)P.auto=null;else{const d=tmp.copy(P.auto.c.g.position).sub(hp);d.y=0;const l=d.length();if(l<2.4){P.auto=null;useSkill('A')}else{mx=d.x/l;mz=d.z/l}}}
 const going=moving||!!P.auto,spd=P.ground?hero.spd:13;
 if(going&&!hero.dead){const tf=Math.atan2(mx,mz);let d=tf-hero.face;d=Math.atan2(Math.sin(d),Math.cos(d));hero.face+=d*Math.min(1,dt*12)}
 const k=P.ground?Math.min(1,dt*12):Math.min(1,dt*2.5);P.v.x=lerp(P.v.x,going&&!hero.dead?mx*spd:0,k);P.v.z=lerp(P.v.z,going&&!hero.dead?mz*spd:0,k);
 const g=(!P.ground&&jumpHeld&&P.v.y<0)?7:28;P.v.y-=g*dt;if(!P.ground&&jumpHeld&&P.v.y<-3)P.v.y=-3;
 if(!hero.dead){hp.addScaledVector(P.v,dt);hp.x=Math.max(-130,Math.min(130,hp.x));hp.z=Math.max(-95,Math.min(120,hp.z));
  collide(hp,.45);rocks.forEach(rk=>{const dx=hp.x-rk[0],dz=hp.z-rk[1],dd=Math.hypot(dx,dz);if(dd<rk[2]&&dd>0&&hp.y<H(hp.x,hp.z)+3){hp.x=rk[0]+dx/dd*rk[2];hp.z=rk[1]+dz/dd*rk[2]}});
  const gy=H(hp.x,hp.z);if(hp.y<=gy){hp.y=gy;if(!P.ground&&P.v.y<-8)ring(hp,0xffffff,2,.45);P.v.y=0;P.ground=true;P.air=0}else if(hp.y>gy+.15)P.ground=false}
 for(const kk in P.cds)P.cds[kk]=Math.max(0,P.cds[kk]-dt);
 if(!hero.dead){hero.mp=Math.min(100,hero.mp+dt*14);hero.hp=Math.min(hero.max,hero.hp+dt*hero.max*.01)}
 ents.forEach(e=>{const c=e.c,pos=c.g.position;
  if(e.dead){e.dead+=dt;c.g.rotation.z=Math.min(Math.PI/2,e.dead*4);c.g.position.y=H(pos.x,pos.z)-Math.min(.3,e.dead*.05);e.lab.style.display='none';
   if(e.dead>(e===hero?3:6)){e.dead=0;e.hp=e.max;e.target=null;c.g.rotation.z=0;const a=Math.random()*6.28,rr=14+Math.random()*40;
    if(e===hero){pos.set(0,H(0,14),14);P.v.set(0,0,0);chat('Đại hiệp đã hồi sinh tại doanh trại.','s')}else if(e.team==='enemy'){const fp=fieldPt();pos.set(fp[0],0,fp[1]);pos.y=H(pos.x,pos.z)}}return}
  e.atk=Math.max(0,e.atk-dt*3);e.cd-=dt;let sp=0;
  if(e!==hero){let goal=null;
   if(e.team==='enemy'){if(e.target&&(e.target.dead||e.target.c.g.position.distanceTo(pos)>18))e.target=null;
    if(!e.target){const cand=[hero,...ents.filter(b=>b.team==='bot')].filter(b=>!b.dead&&b.c.g.position.distanceTo(pos)<(b===hero?9:6));if(cand.length)e.target=cand[0]}}
   else if(!e.target||e.target.dead){e.target=Math.random()<dt*2?nearestEnemy(pos,35):null}
   if(e.target){const tp2=e.target.c.g.position,d=pos.distanceTo(tp2);faceTo(e,tp2);if(d>2.2)goal=tp2;else if(e.cd<=0){e.cd=e.team==='enemy'?1.4:.9;e.atk=1;
     hit(e,e.target,e.team==='enemy'?Math.floor(400+Math.random()*500):Math.floor(800+Math.random()*1500),false);
     if(e.team==='bot'&&Math.random()<.3)addFx(slashArc(pos,e.face,pick([0xffd36b,0xd6a3ff,0x7fffd0]),true),.35,(f,k)=>{f.m.material.opacity=1-k;f.m.scale.setScalar(1+k)})}}
   else{if(!e.wp||pos.distanceTo(e.wp)<1){if(Math.random()<.01){const a=Math.random()*6.28,rr=Math.random()*8;e.wp=new T.Vector3(e.home.x+Math.cos(a)*rr,0,e.home.y+Math.sin(a)*rr)}else if(e.wp&&pos.distanceTo(e.wp)<1)e.wp=null}
    if(e.wp)goal=e.wp}
   if(goal){const d=tmp.copy(goal).sub(pos);d.y=0;const l=d.length();if(l>.1){sp=e.spd*(e.target?1:.45);pos.x+=d.x/l*sp*dt;pos.z+=d.z/l*sp*dt;if(!e.target)e.face=Math.atan2(d.x,d.z)}}
   pos.y=H(pos.x,pos.z);c.g.rotation.y=e.face}
  else{c.g.rotation.y=e.face;sp=Math.hypot(P.v.x,P.v.z)}
  animChar(c,sp,e===hero&&!P.ground,dt,e.atk);if(e===hero&&vrmReady)animVRM(sp,!P.ground,e.atk,uTime.value,c.walk,dt);
  proj.copy(pos);proj.y+=2.5;const dd=proj.distanceTo(camera.position);proj.project(camera);
  if(proj.z>1||dd>55)e.lab.style.display='none';else{e.lab.style.display='block';e.lab.style.transform=`translate(${(proj.x*.5+.5)*innerWidth}px,${(-proj.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`;e.hbi.style.width=(e.hp/e.max*100)+'%'}});
 if(hero.c.w.userData.great&&!hero.dead){hero.c.w.updateMatrixWorld();for(let i=0;i<(touch?2:4);i++){const v=new T.Vector3(0,(Math.random()-.5)*.2,.3+Math.random()*2.5).applyMatrix4(hero.c.w.matrixWorld);emit(v.x,v.y,v.z,R()*.4,.6+Math.random()*.6,R()*.4,...glowRGB(),.5,.5,0,1)}}
 updGlow(dt);flash.intensity=Math.max(0,flash.intensity-dt*18);
 for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;f.upd(f,Math.min(1,f.t/f.d),dt);if(f.t>=f.d){scene.remove(f.m);f.m.traverse(o=>{if(o.geometry&&!o.geometry.userData.keep)o.geometry.dispose();if(o.material&&!o.material.userData.keep)o.material.dispose()});fx.splice(i,1)}}
 ringPool.forEach(r=>{if(r.t>=r.d){r.m.visible=false;return}r.t+=dt;const k=r.t/r.d,s=.3+k*r.s;r.m.scale.set(s,s,s);r.m.material.color.copy(r.c).multiplyScalar((1-k)*1.8)});
 for(let i=0;i<SPN;i++){if(spL[i]<=0)continue;const prev=spL[i];spL[i]-=dt*1.8;spV[i*3+1]-=9*dt;for(let j=0;j<3;j++){spP[i*3+j]+=spV[i*3+j]*dt;spC[i*3+j]*=Math.max(0,spL[i])/prev}}
 spG.attributes.position.needsUpdate=spG.attributes.color.needsUpdate=true;
 for(let i=0;i<DN;i++){let x=dpos[i*3]+dt*2.2,y=dpos[i*3+1]+Math.sin(time+i)*dt*.3,z=dpos[i*3+2]+dt*.8;if(Math.abs(x-hp.x)>35||Math.abs(z-hp.z)>35){x=hp.x+(Math.random()-.5)*70;z=hp.z+(Math.random()-.5)*70;y=H(x,z)+Math.random()*7}dpos[i*3]=x;dpos[i*3+1]=y;dpos[i*3+2]=z}dustG.attributes.position.needsUpdate=true;
 chatT-=dt;if(chatT<0){chatT=5+Math.random()*7;chat('<span class="n">'+esc(pick(botNames))+'</span>: '+esc(pick(chatLines)))}
 $('hp').querySelector('i').style.transform=`scaleX(${hero.hp/hero.max})`;$('hp').querySelector('span').textContent=Math.floor(hero.hp)+'/'+hero.max;
 $('mp').querySelector('i').style.transform=`scaleX(${hero.mp/100})`;$('mp').querySelector('span').textContent=Math.floor(hero.mp)+'/100';$('xp').querySelector('i').style.transform=`scaleX(${hero.xp/(100+hero.lv*60)})`;
 [['sA','A'],['s1','1'],['s2','2'],['s3','3'],['s4','4'],['s5','5'],['s6','6']].forEach(([id,k])=>$(id).querySelector('i').style.setProperty('--cd',(P.cds[k]/CD[k]*100)+'%'));
 mmT-=dt;if(mmT<0){mmT=.1;drawMinimap()}
 if(creating){const a=hero.face+yaw;camT.set(hp.x,hp.y+(innerWidth<700?.35:1.05),hp.z);camP.set(hp.x+Math.sin(a)*3.6,hp.y+1.25,hp.z+Math.cos(a)*3.6);camera.position.lerp(camP,Math.min(1,dt*6));camera.lookAt(camT);if(innerWidth>=700)camera.setViewOffset(innerWidth,innerHeight,180,0,innerWidth,innerHeight);else camera.clearViewOffset()}else{camera.clearViewOffset();camT.set(hp.x,hp.y+1.2,hp.z);camP.set(camT.x+Math.sin(yaw)*Math.cos(pitch)*dist,camT.y+Math.sin(pitch)*dist,camT.z+Math.cos(yaw)*Math.cos(pitch)*dist);
 const cg=H(camP.x,camP.z)+1;if(camP.y<cg)camP.y=cg;camera.position.lerp(camP,Math.min(1,dt*8));
 shake=Math.max(0,shake-dt);camera.position.x+=(Math.random()-.5)*shake*.6;camera.position.y+=(Math.random()-.5)*shake*.6;camera.lookAt(camT);}
 if(skyM)skyM.position.copy(camera.position);sun.position.copy(hp).addScaledVector(sunDir,150);sun.target.position.copy(hp);
 for(let i=dmgs.length-1;i>=0;i--){const d=dmgs[i];d.t+=dt;d.p.y+=dt*1.8;d.p.x+=d.vx*dt;proj.copy(d.p).project(camera);d.d.style.left=(proj.x*.5+.5)*innerWidth+'px';d.d.style.top=(-proj.y*.5+.5)*innerHeight+'px';d.d.style.opacity=Math.min(1,2-d.t*2);if(d.t>1){d.d.remove();dmgs.splice(i,1)}}
}
function collide(p,r){for(const c of colliders){if(p.y>=c[4]-.1)continue;if(p.x>c[0]-r&&p.x<c[1]+r&&p.z>c[2]-r&&p.z<c[3]+r){const dl=p.x-(c[0]-r),dr=c[1]+r-p.x,dn=p.z-(c[2]-r),ds=c[3]+r-p.z,m=Math.min(dl,dr,dn,ds);if(m===dl)p.x=c[0]-r;else if(m===dr)p.x=c[1]+r;else if(m===dn)p.z=c[2]-r;else p.z=c[3]+r}}}
const fovFit=()=>{camera.fov=innerWidth<innerHeight?60:45};fovFit();
addEventListener('resize',()=>{fovFit();camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);bloom.setSize(innerWidth/2,innerHeight/2)});
const clock=new T.Clock();let first=true;
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);update(dt,clock.elapsedTime);composer.render();if(first&&vrmReady){first=false;const l=$('load');l.style.opacity=0;setTimeout(()=>l.remove(),700)}}
loop();
window.__demo={SWR,setSW:(a,b,c)=>{hero.vw&&hero.vw.rotation.set(a,b,c)},hero,P,useSkill,ents,setView:(y,p,d)=>{yaw=y;pitch=p;dist=d}};
}
